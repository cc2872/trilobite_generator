<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilobite Morphospace</title>
<style>
  :root{--bg:#ffffff;--ink:#000000;--mid:#666666;--line:#e5e5e5;--soft:#f5f5f5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;overflow:hidden;font-size:12px}
  #app{display:grid;grid-template-columns:320px 1fr;height:100vh}
  .panel{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .controls{overflow-y:auto;padding:18px 20px;flex:1}
  .gtitle{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:8px 0 4px;border-bottom:1px solid var(--ink);margin:18px 0 6px;cursor:pointer;user-select:none}
  .gtitle:first-child{margin-top:0}
  .group.closed .body{display:none}
  .ctrl{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:center;margin:9px 0}
  .ctrl .lab{grid-column:1/3;display:flex;justify-content:space-between}
  .ctrl .lab span:last-child{color:var(--mid);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--ink);outline:none;margin:6px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:none;cursor:pointer}
  input[type=number]{width:60px;background:var(--bg);color:var(--ink);border:none;border-bottom:1px solid var(--line);padding:3px 0;font:inherit;font-variant-numeric:tabular-nums;text-align:right}
  input[type=number]:focus{outline:none;border-bottom-color:var(--ink)}
  select{width:100%;background:var(--bg);color:var(--ink);border:none;border-bottom:1px solid var(--ink);padding:6px 0;font:inherit;border-radius:0}
  .actions{padding:14px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:8px 6px;font:inherit;cursor:pointer}
  button.primary{background:var(--ink);color:var(--bg)}
  button:hover{background:var(--soft)} button.primary:hover{background:#222} button:disabled{opacity:.35;cursor:default}
  .stage{position:relative;min-width:0}
  canvas{display:block}
  .overlay{position:absolute;left:16px;top:14px;color:var(--ink);line-height:1.5;pointer-events:none;max-width:60%;font-variant-numeric:tabular-nums}
  .overlay .warn{color:var(--ink);text-decoration:underline}
  .status{position:absolute;right:16px;top:14px;color:var(--mid)} .status.busy{color:var(--ink)}
  .rollbar{position:absolute;left:16px;right:16px;bottom:16px;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center}
  .rollbar input[type=range]{height:1px} .rollbar input[type=range]::-webkit-slider-thumb{width:16px;height:16px}
  .rollbar .val{min-width:130px;text-align:right;font-variant-numeric:tabular-nums}
  .log{position:absolute;right:16px;bottom:64px;width:380px;max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;white-space:pre;display:none}
  .links{display:flex;flex-wrap:wrap;gap:4px 10px} .links a{color:var(--ink);font-size:11px}
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <aside class="panel">
    <div class="controls" id="controls">
      <select id="preset"></select>
      <div id="knobs"></div>
      <div class="links" id="links"></div>
    </div>
    <div class="actions">
      <button class="primary" id="build">Build</button>
      <button id="preview">Segment</button>
      <button id="check">Check</button>
      <button id="dump">Copy P</button>
    </div>
  </aside>
  <div class="stage" id="stage">
    <div class="overlay" id="overlay"></div>
    <div class="status" id="status"></div>
    <div class="log" id="log"></div>
    <div class="rollbar">
      <input type="range" id="enroll" min="0" max="1" step="0.005" value="0">
      <div class="val" id="enrollval">0% · 0°</div>
      <button id="play">Roll</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const $ = id => document.getElementById(id);
let CFG, P = {}, INT = new Set();
let built = null;          // last build result
let groups = [];           // nested three.js groups, one per joint
let enroll = 0, playing = false, flip = 1;

// ---------------- controls
async function init(){
  let resp;
  try {
    resp = await fetch('/api/config');
    if (!resp.ok) throw new Error(`HTTP ${resp.status} from /api/config`);
    CFG = await resp.json();
  } catch (e) {
    setStatus('config failed: ' + e.message + ' — the server did not return the knob list; check /api/config', false);
    return;
  }
  INT = new Set(CFG.int_keys); P = {...CFG.defaults};
  const sel = $('preset');
  for (const name of Object.keys(CFG.presets)) { const o = document.createElement('option'); o.textContent = name; sel.appendChild(o); }
  sel.onchange = () => { P = {...CFG.defaults, ...CFG.presets[sel.value]}; syncAll(); refreshDerived(); };
  const host = $('knobs'); let group = null, body = null;
  for (const [key,label,lo,hi,step,g] of CFG.knobs){
    if (g !== group){
      group = g;
      const wrap = document.createElement('div'); wrap.className = 'group';
      const t = document.createElement('div'); t.className='gtitle'; t.textContent = g; t.onclick = () => wrap.classList.toggle('closed');
      body = document.createElement('div'); body.className='body'; wrap.append(t, body); host.appendChild(wrap);
    }
    const c = document.createElement('div'); c.className = 'ctrl';
    c.innerHTML = `<div class="lab"><span>${label}</span><span id="v-${key}"></span></div>
      <input type="range" id="s-${key}" min="${lo}" max="${hi}" step="${step}" value="${P[key]}">
      <input type="number" id="n-${key}" min="${lo}" max="${hi}" step="${step}" value="${P[key]}">`;
    body.appendChild(c);
    const s = c.querySelector(`#s-${key}`), n = c.querySelector(`#n-${key}`);
    s.addEventListener('input', () => setP(key, parseFloat(s.value)));
    n.addEventListener('change', () => setP(key, parseFloat(n.value)));
  }
  syncAll(); refreshDerived(); initScene();
}
function setP(key, v){
  if (INT.has(key)) { v = Math.round(v); if (key === 'nKnuckles' && v % 2 === 0) v += 1; }
  P[key] = v; sync(key); refreshDerived();
}
function sync(key){ const v = P[key]; $('s-'+key).value = v; $('n-'+key).value = v; $('v-'+key).textContent = INT.has(key) ? v : (+v).toFixed(3).replace(/\.?0+$/,''); }
function syncAll(){ for (const k of CFG.knobs) sync(k[0]); }

let dTimer = null;
function refreshDerived(){
  clearTimeout(dTimer);
  dTimer = setTimeout(async () => {
    const d = await (await fetch('/api/derived', {method:'POST', body: JSON.stringify({P})})).json();
    renderOverlay(d);
  }, 80);
}
function renderOverlay(d, note){
  $('overlay').innerHTML =
    `${d.pitch} mm pitch · ${d.joints} × ${P.maxAngle}° = ${d.total_curl}° · ${d.pyg_class}<br>` +
    `hinge ${d.hinge_z} · knuckle ${d.knuckle} · pin wall ${d.pin_wall}<br>` +
    d.warnings.map(w => `<span class="warn">${w}</span>`).join('<br>');
}
function setStatus(t, busy){ const s = $('status'); s.textContent = t; s.className = 'status' + (busy ? ' busy' : ''); }
function log(t){ const l = $('log'); l.style.display = 'block'; l.textContent = t; }

// ---------------- three.js
let renderer, scene, camera, controls, root;
function initScene(){
  const stage = $('stage');
  renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio);
  stage.prepend(renderer.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
  camera = new THREE.PerspectiveCamera(40, 1, 1, 5000); camera.position.set(140, 110, 190);
  controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 10, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(80, 160, 120); scene.add(key);
  const grid = new THREE.GridHelper(400, 40, 0xdddddd, 0xeeeeee); grid.position.y = -0.5; scene.add(grid);
  root = new THREE.Group(); root.rotation.x = -Math.PI / 2;   // build123d Z-up -> three.js Y-up
  scene.add(root);
  const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(stage); resize();
  (function loop(t){ requestAnimationFrame(loop); if (playing){ const u = (t % 3200) / 3200; setEnroll(0.5 - 0.5 * Math.cos(u * 2 * Math.PI)); } controls.update(); renderer.render(scene, camera); })(0);
}
const mat = new THREE.MeshStandardMaterial({color: 0xbfbfbf, roughness: 0.8, metalness: 0.0});
const loader = new STLLoader();
const loadSTL = url => new Promise((res, rej) => loader.load(url + '?t=' + Date.now(), res, undefined, rej));

async function showBuild(b){
  if (!root) { throw new Error('3D scene not initialised (config never loaded — reload the page)'); }
  root.clear(); groups = [];
  const geos = await Promise.all(b.urls.map(loadSTL));
  if (b.names.length === 1){ root.add(new THREE.Mesh(geos[0], mat)); frame(); return; }
  // nested chain: head > seg0 > ... > tail ; each group's origin is its front hinge (head: rear hinge)
  let parent = root;
  b.names.forEach((n, i) => {
    const g = new THREE.Group();
    g.position.set(0, i === 0 ? 0 : b.offsets[i - 1], 0);
    const mesh = new THREE.Mesh(geos[i], mat); mesh.position.set(0, 0, -b.hinge_z); g.add(mesh);
    parent.add(g); parent = g; groups.push(g);
  });
  root.position.set(0, b.hinge_z, 0);          // lift so the shells sit on the grid (world Y is up)
  setEnroll(enroll); frame();
}
function setEnroll(e){
  enroll = e; $('enroll').value = e;
  const th = e * (built ? built.maxAngle : P.maxAngle);
  $('enrollval').textContent = `${Math.round(e * 100)}% · ${th.toFixed(1)}° / joint`;
  groups.forEach((g, i) => { if (i > 0) g.rotation.x = -flip * THREE.MathUtils.degToRad(th); });
}
function frame(){
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.6, 0.55, 0.95).multiplyScalar(s * 0.9)); camera.near = s / 100; camera.far = s * 10; camera.updateProjectionMatrix();
}

// ---------------- actions
async function build(mode){
  setStatus(mode === 'segment' ? 'building one segment…' : 'building whole animal (30–60 s)…', true);
  document.querySelectorAll('.actions button').forEach(b => b.disabled = true);
  try {
    const r = await (await fetch('/api/build', {method:'POST', body: JSON.stringify({P, mode})})).json();
    if (r.error) throw new Error(r.error);
    built = r; await showBuild(r); renderOverlay(r.derived, `built in ${r.seconds}s`);
    if (r.measure) { const m = r.measure; $('overlay').innerHTML += `<br><b>e_max ${m.e_max}</b> · free curl ${m.free_curl_deg}° of ${m.total_curl_deg}° · gap ${m.closure_gap_mm} mm · ${m.enroll_class}` + (m.stopped_by.length ? ` · stopped by parts ${m.stopped_by.map(x=>x[0]+'–'+x[1]).join(', ')}` : ''); }
    $('links').innerHTML = r.urls.map((u, i) => `<a href="${u}" download>${r.names[i]}.stl</a>`).join('');
    setStatus(`built in ${r.seconds}s`, false);
  } catch (e) { setStatus('error: ' + e.message, false); }
  document.querySelectorAll('.actions button').forEach(b => b.disabled = false);
}
$('build').onclick = () => build('animal');
$('preview').onclick = () => build('segment');
$('check').onclick = async () => {
  setStatus('checking collisions at 5 enroll values…', true);
  const r = await (await fetch('/api/check', {method:'POST', body: JSON.stringify({P})})).json();
  log(r.text || r.error); setStatus('check done', false);
};
$('dump').onclick = () => {
  const s = 'P = dict(' + Object.entries(P).map(([k, v]) => `${k}=${INT.has(k) ? Math.round(v) : +(+v).toFixed(4)}`).join(', ') + ')';
  navigator.clipboard?.writeText(s); log(s);
};
$('enroll').addEventListener('input', e => { playing = false; $('play').textContent = 'Roll'; setEnroll(parseFloat(e.target.value)); });
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Roll'; };
document.addEventListener('keydown', e => { if (e.key === 'f') { flip = -flip; setEnroll(enroll); } });
init();
</script>
</body>
</html>
