<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilobite Morphospace Generator</title>
<style>
  :root{--ground:#1b2026;--panel:#20262e;--line:#333d47;--ink:#e8e2d4;--dim:#9aa3ac;--accent:#4fc4d6;--accent-dim:#2c6d76;--warn:#f0a35a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:360px 1fr;height:100vh}
  .panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0;font-weight:600}
  .sub{font-size:12px;color:var(--dim);margin-top:3px}
  .controls{overflow-y:auto;padding:6px 20px 20px;flex:1}
  .gtitle{font-size:11px;color:var(--accent);font-weight:600;padding:6px 0;border-bottom:1px solid var(--line);margin:14px 0 6px;cursor:pointer;user-select:none}
  .gtitle::before{content:"▾ "} .group.closed .gtitle::before{content:"▸ "} .group.closed .body{display:none}
  .ctrl{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;margin:8px 0}
  .ctrl .lab{grid-column:1/3;display:flex;justify-content:space-between;font-size:12px}
  .ctrl .lab span:last-child{color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px}
  input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--ground);box-shadow:0 0 0 1px var(--accent-dim)}
  input[type=number]{width:64px;background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
  select{width:100%;background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px;font-family:inherit}
  .actions{padding:12px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 8px;font-size:12px;cursor:pointer;font-family:inherit}
  button.primary{background:var(--accent);color:#08222a;border-color:var(--accent);font-weight:600}
  button:hover{border-color:var(--accent)} button:disabled{opacity:.45;cursor:default}
  .stage{position:relative;min-width:0}
  canvas{display:block}
  .overlay{position:absolute;left:16px;top:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);line-height:1.55;pointer-events:none;max-width:60%}
  .overlay b{color:var(--accent);font-weight:500}
  .overlay .warn{color:var(--warn)}
  .status{position:absolute;right:16px;top:14px;font-size:12px;color:var(--dim)}
  .status.busy{color:var(--accent)}
  .rollbar{position:absolute;left:16px;right:16px;bottom:16px;background:rgba(32,38,46,.92);border:1px solid var(--line);border-radius:4px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center}
  .rollbar input[type=range]{height:6px} .rollbar input[type=range]::-webkit-slider-thumb{width:20px;height:20px}
  .rollbar label{font-size:12px;white-space:nowrap}
  .rollbar .val{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);min-width:150px;text-align:right}
  .log{position:absolute;right:16px;bottom:82px;width:380px;max-height:220px;overflow:auto;background:rgba(32,38,46,.92);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);white-space:pre;display:none}
  .links a{color:var(--accent);font-size:11px;margin-right:8px}
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <aside class="panel">
    <header>
      <h1>Trilobite Morphospace Generator</h1>
      <div class="sub">Every slider is one axis of the body plan. Build to see it; scrub to roll it.</div>
    </header>
    <div class="controls" id="controls">
      <div class="gtitle" style="cursor:default">Preset</div>
      <select id="preset"></select>
      <div id="knobs"></div>
      <div class="gtitle" style="cursor:default">Downloads</div>
      <div class="links" id="links">build first</div>
    </div>
    <div class="actions">
      <button class="primary" id="build">Build animal</button>
      <button id="preview">Preview one segment</button>
      <button id="check">Check enrollment</button>
      <button id="dump">Copy P as Python</button>
    </div>
  </aside>
  <div class="stage" id="stage">
    <div class="overlay" id="overlay"></div>
    <div class="status" id="status">idle</div>
    <div class="log" id="log"></div>
    <div class="rollbar">
      <label>Enrollment</label>
      <input type="range" id="enroll" min="0" max="1" step="0.005" value="0">
      <div class="val" id="enrollval">0% · 0°</div>
      <button id="play">▶ Roll</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const $ = id => document.getElementById(id);
let CFG, P = {}, INT = new Set();
let built = null;          // last build result
let groups = [];           // nested three.js groups, one per joint
let enroll = 0, playing = false, flip = 1;

// ---------------- controls
async function init(){
  CFG = await (await fetch('/api/config')).json();
  INT = new Set(CFG.int_keys); P = {...CFG.defaults};
  const sel = $('preset');
  for (const name of Object.keys(CFG.presets)) { const o = document.createElement('option'); o.textContent = name; sel.appendChild(o); }
  sel.onchange = () => { P = {...CFG.defaults, ...CFG.presets[sel.value]}; syncAll(); refreshDerived(); };
  const host = $('knobs'); let group = null, body = null;
  for (const [key,label,lo,hi,step,g] of CFG.knobs){
    if (g !== group){
      group = g;
      const wrap = document.createElement('div'); wrap.className = 'group';
      const t = document.createElement('div'); t.className='gtitle'; t.textContent = g; t.onclick = () => wrap.classList.toggle('closed');
      body = document.createElement('div'); body.className='body'; wrap.append(t, body); host.appendChild(wrap);
    }
    const c = document.createElement('div'); c.className = 'ctrl';
    c.innerHTML = `<div class="lab"><span>${label}</span><span id="v-${key}"></span></div>
      <input type="range" id="s-${key}" min="${lo}" max="${hi}" step="${step}" value="${P[key]}">
      <input type="number" id="n-${key}" min="${lo}" max="${hi}" step="${step}" value="${P[key]}">`;
    body.appendChild(c);
    const s = c.querySelector(`#s-${key}`), n = c.querySelector(`#n-${key}`);
    s.addEventListener('input', () => setP(key, parseFloat(s.value)));
    n.addEventListener('change', () => setP(key, parseFloat(n.value)));
  }
  syncAll(); refreshDerived(); initScene();
}
function setP(key, v){
  if (INT.has(key)) { v = Math.round(v); if (key === 'nKnuckles' && v % 2 === 0) v += 1; }
  P[key] = v; sync(key); refreshDerived();
}
function sync(key){ const v = P[key]; $('s-'+key).value = v; $('n-'+key).value = v; $('v-'+key).textContent = INT.has(key) ? v : (+v).toFixed(3).replace(/\.?0+$/,''); }
function syncAll(){ for (const k of CFG.knobs) sync(k[0]); }

let dTimer = null;
function refreshDerived(){
  clearTimeout(dTimer);
  dTimer = setTimeout(async () => {
    const d = await (await fetch('/api/derived', {method:'POST', body: JSON.stringify({P})})).json();
    renderOverlay(d, built ? '' : 'not built yet — press Build');
  }, 80);
}
function renderOverlay(d, note){
  $('overlay').innerHTML =
    `pitch <b>${d.pitch} mm</b> · <b>${d.joints}</b> joints × ${P.maxAngle}° = total curl <b>${d.total_curl}°</b> · ${d.pyg_class}<br>` +
    `head ${d.head_mm} · thorax ${d.thorax_mm} · tail ${d.tail_mm} mm · last segment ${d.last_width} mm wide<br>` +
    `hinge z ${d.hinge_z} · width ${d.hinge_width} · knuckle ${d.knuckle} mm · pin wall ${d.pin_wall} mm<br>` +
    d.warnings.map(w => `<span class="warn">⚠ ${w}</span>`).join('<br>') + (note ? `<br><span style="color:var(--dim)">${note}</span>` : '');
}
function setStatus(t, busy){ const s = $('status'); s.textContent = t; s.className = 'status' + (busy ? ' busy' : ''); }
function log(t){ const l = $('log'); l.style.display = 'block'; l.textContent = t; }

// ---------------- three.js
let renderer, scene, camera, controls, root;
function initScene(){
  const stage = $('stage');
  renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio);
  stage.prepend(renderer.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2026);
  camera = new THREE.PerspectiveCamera(40, 1, 1, 5000); camera.position.set(140, 110, 190);
  controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 10, 0);
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x223040, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(80, 160, 120); scene.add(key);
  const grid = new THREE.GridHelper(400, 40, 0x333d47, 0x28303a); grid.position.y = -0.5; scene.add(grid);
  root = new THREE.Group(); root.rotation.x = -Math.PI / 2;   // build123d Z-up -> three.js Y-up
  scene.add(root);
  const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(stage); resize();
  (function loop(t){ requestAnimationFrame(loop); if (playing){ const u = (t % 3200) / 3200; setEnroll(0.5 - 0.5 * Math.cos(u * 2 * Math.PI)); } controls.update(); renderer.render(scene, camera); })(0);
}
const mat = new THREE.MeshStandardMaterial({color: 0xd9c493, roughness: 0.65, metalness: 0.05});
const loader = new STLLoader();
const loadSTL = url => new Promise((res, rej) => loader.load(url + '?t=' + Date.now(), res, undefined, rej));

async function showBuild(b){
  root.clear(); groups = [];
  const geos = await Promise.all(b.urls.map(loadSTL));
  if (b.names.length === 1){ root.add(new THREE.Mesh(geos[0], mat)); frame(); return; }
  // nested chain: head > seg0 > ... > tail ; each group's origin is its front hinge (head: rear hinge)
  let parent = root;
  b.names.forEach((n, i) => {
    const g = new THREE.Group();
    g.position.set(0, i === 0 ? 0 : b.offsets[i - 1], 0);
    const mesh = new THREE.Mesh(geos[i], mat); mesh.position.set(0, 0, -b.hinge_z); g.add(mesh);
    parent.add(g); parent = g; groups.push(g);
  });
  root.position.set(0, b.hinge_z, 0);          // lift so the shells sit on the grid (world Y is up)
  setEnroll(enroll); frame();
}
function setEnroll(e){
  enroll = e; $('enroll').value = e;
  const th = e * (built ? built.maxAngle : P.maxAngle);
  $('enrollval').textContent = `${Math.round(e * 100)}% · ${th.toFixed(1)}° / joint`;
  groups.forEach((g, i) => { if (i > 0) g.rotation.x = -flip * THREE.MathUtils.degToRad(th); });
}
function frame(){
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.6, 0.55, 0.95).multiplyScalar(s * 0.9)); camera.near = s / 100; camera.far = s * 10; camera.updateProjectionMatrix();
}

// ---------------- actions
async function build(mode){
  setStatus(mode === 'segment' ? 'building one segment…' : 'building whole animal (30–60 s)…', true);
  document.querySelectorAll('.actions button').forEach(b => b.disabled = true);
  try {
    const r = await (await fetch('/api/build', {method:'POST', body: JSON.stringify({P, mode})})).json();
    if (r.error) throw new Error(r.error);
    built = r; await showBuild(r); renderOverlay(r.derived, `built in ${r.seconds}s`);
    $('links').innerHTML = r.urls.map((u, i) => `<a href="${u}" download>${r.names[i]}.stl</a>`).join('');
    setStatus(`built in ${r.seconds}s`, false);
  } catch (e) { setStatus('error: ' + e.message, false); }
  document.querySelectorAll('.actions button').forEach(b => b.disabled = false);
}
$('build').onclick = () => build('animal');
$('preview').onclick = () => build('segment');
$('check').onclick = async () => {
  setStatus('checking collisions at 5 enroll values…', true);
  const r = await (await fetch('/api/check', {method:'POST', body: JSON.stringify({P})})).json();
  log(r.text || r.error); setStatus('check done', false);
};
$('dump').onclick = () => {
  const s = 'P = dict(' + Object.entries(P).map(([k, v]) => `${k}=${INT.has(k) ? Math.round(v) : +(+v).toFixed(4)}`).join(', ') + ')';
  navigator.clipboard?.writeText(s); log(s);
};
$('enroll').addEventListener('input', e => { playing = false; $('play').textContent = '▶ Roll'; setEnroll(parseFloat(e.target.value)); });
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '❚❚ Pause' : '▶ Roll'; };
document.addEventListener('keydown', e => { if (e.key === 'f') { flip = -flip; setEnroll(enroll); } });
init();
</script>
</body>
</html>
