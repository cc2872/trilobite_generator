<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilobite Ring Tree</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#000; --grid:#131313; --ink:#f0f0f0; --ink-dim:#8a8a8a; --ink-faint:#3a3a3a; --rule:#f0f0f0; --glass:rgba(0,0,0,.85);
    --mono:"DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", ui-monospace, monospace;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;margin:0;padding:0;overflow:hidden;position:relative;
       background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);background-size:42px 42px}
  #stage{position:absolute;inset:0;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}
  #stage{user-select:none;-webkit-user-select:none}
  svg{width:100%;height:100%;display:block}
  .trunk{fill:none;stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
  .tick{stroke:var(--ink-dim);stroke-width:1;vector-effect:non-scaling-stroke}
  .period{fill:var(--ink-dim);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .lane{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:butt;vector-effect:non-scaling-stroke}
  .hit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer;vector-effect:non-scaling-stroke}
  .branch{fill:none;stroke:var(--ink);stroke-width:1;opacity:.7;vector-effect:non-scaling-stroke}
  .branch.uncertain{stroke-dasharray:2 3}
  .node{cursor:pointer;transition:opacity .35s}
  .node.dead{opacity:.22}
  .node circle{fill:var(--bg);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
  .node.has circle{fill:var(--ink)}
  .node .sil .body{fill:var(--ink);fill-opacity:.14;stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
  .node .sil .ax,.node .sil .seg{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
  .node.empty .sil .body,.node.empty .sil .ax,.node.empty .sil .seg{stroke:var(--ink-dim)}
  .node:hover .sil .body,.node.sel .sil .body{fill-opacity:.22;stroke:#fff}
  .node:hover .sil .ax,.node:hover .sil .seg,.node.sel .sil .ax,.node.sel .sil .seg{stroke:#fff}
  .node.empty .lane{stroke:var(--ink-dim)}
  .node.empty .branch{stroke:var(--ink-dim)}
  .node text{fill:var(--ink);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .node.rank-suborder text{fill:var(--ink-dim);text-transform:none;letter-spacing:.04em}
  .node.rank-superfamily text{fill:var(--ink-dim);text-transform:none;letter-spacing:.02em}
  .node:hover .lane, .node.sel .lane{stroke-width:2}
  .node:hover text, .node.sel text{fill:var(--ink)}
  .node.sel circle{stroke-width:2}
  .node:focus{outline:none}
  .node:focus-visible circle{stroke-width:3}
  .centre{fill:var(--ink-dim);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;text-anchor:middle}
  .mark{cursor:help}
  .mark path,.mark circle,.mark line{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
  .mark.nomodel path,.mark.nomodel circle,.mark.nomodel line{stroke:var(--ink-dim);stroke-dasharray:1.5 1.5}
  .mark:hover path,.mark:hover circle,.mark:hover line{stroke-width:2}
  .node.empty .mark path,.node.empty .mark circle,.node.empty .mark line{stroke:var(--ink-dim)}
  .node.nofit{opacity:.15}
  .node.fit .lane{stroke-width:2}
  .band{fill:none;stroke:var(--ink);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none}
  .loc{display:none}
  .loc button{width:22px;height:22px;padding:0;border:1px solid var(--ink-faint);background:none;cursor:pointer;display:grid;place-items:center}
  .loc button svg{width:16px;height:16px;overflow:visible}
  .loc button path,.loc button circle,.loc button line{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
  .loc button.on{border-color:var(--ink);background:var(--ink)}
  .loc button.on path,.loc button.on circle,.loc button.on line{stroke:var(--bg)}
  .loc button:disabled{cursor:default;opacity:.35}
  .loc button:disabled path,.loc button:disabled circle,.loc button:disabled line{stroke-dasharray:1.5 1.5}
  .loc button:focus-visible{outline:1px dashed var(--ink);outline-offset:2px}
  #traits{left:22px;right:22px;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:6px 0 8px;scrollbar-width:thin}
  #traits button{flex:0 0 auto;width:104px;border:1px solid var(--ink-faint);background:var(--glass);padding:6px 6px 5px;cursor:pointer;display:grid;gap:5px;justify-items:center;color:var(--ink);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;line-height:1.2;text-align:center}
  #traits button img{width:90px;height:76px;object-fit:contain;display:block}
  #traits button:hover{border-color:var(--ink)}
  #traits button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
  #traits button.on img{filter:invert(1)}
  #traits button:disabled{cursor:default;border-style:dashed;color:var(--ink-dim)}
  #traits button:disabled img{opacity:.45}
  #traits button:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
  .cursor{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
  .cursor-dot{fill:var(--ink);stroke:var(--bg);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .cursor-halo{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}

  .hud{position:absolute;z-index:2;pointer-events:none;text-transform:uppercase;letter-spacing:.08em}
  .hud > *{pointer-events:auto}
  #top{left:0;right:0;top:0;padding:16px 22px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:22px;flex-wrap:wrap;color:var(--ink)}
  #top .btn{background:var(--glass)}
  #top .btn:hover{background:var(--ink)}
  #views{display:flex}
  #views .btn+.btn{border-left:0}
  #top #views .btn.on, #top #play.on{background:var(--ink);color:var(--bg)}
  .end{fill:var(--ink)}
  .globe .sea{fill:var(--bg);fill-opacity:.6;stroke:none}
  .globe .grat{fill:none;stroke:var(--ink-faint);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7}
  .globe .land{fill:none;stroke:var(--ink-dim);stroke-width:3.1;stroke-linecap:round}
  .globe .land.high{stroke:var(--ink);stroke-width:3.4}
  .plate{fill:var(--ink);fill-opacity:.62;font-family:var(--mono);font-size:15px;letter-spacing:.34em;text-transform:uppercase;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;cursor:help}
  .plate.small{font-size:8.5px;letter-spacing:.2em}
  .site{cursor:pointer;transition:opacity .35s}
  .site .ring{fill:var(--bg);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
  .site .pip{fill:var(--ink)}
  .site text{font-family:var(--mono);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
  .site .sname{fill:var(--ink);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
  .site .swho{fill:var(--ink-dim);font-size:7.5px;letter-spacing:.04em}
  .site.small .sname{font-size:7px;fill:var(--ink-dim)}
  .site.nofit{opacity:.22}
  .site.fit .ring{fill:var(--ink)} .site.fit .pip{fill:var(--bg)}
  .site.sel{opacity:1}
  .site.sel .ring{fill:var(--ink)} .site.sel .pip{fill:var(--bg)}
  .site:hover .ring,.site:focus-visible .ring{stroke-width:2.6}
  .site:focus{outline:none}
  #top .k{background:var(--glass);padding:2px 0}
  #top .k span{color:var(--ink-dim)}

  #panel{right:22px;top:calc(22px + env(safe-area-inset-top,0px));width:292px;border:1px solid var(--rule);background:var(--glass);padding:14px 18px 16px;line-height:1.75}
  #panel h2{font-weight:400;font-size:12px;margin:0 0 12px;letter-spacing:.14em;text-align:center}
  dl{display:grid;grid-template-columns:8ch 1fr;gap:0 10px;margin:0 0 12px}
  dt,dd{margin:0;font-size:12px}
  dt{color:var(--ink)}
  dd{color:var(--ink);text-transform:none;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  dd#p-feat{white-space:normal;line-height:1.5;padding:2px 0}
  dd .dim{color:var(--ink-dim)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);color:var(--ink);padding:5px 10px;text-decoration:none;background:none;cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--bg)}
  .btn:hover{background:var(--ink);color:var(--bg)}
  .btn:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
  .note{display:none}

  #bottom{left:0;right:0;bottom:0;padding:14px 22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .now{background:var(--glass);padding:4px 0;display:flex;gap:0;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
  .now b{font-weight:400}
  .now span{margin-left:1.4em}
  #time{flex:1 1 220px;min-width:0;height:18px;background:transparent;-webkit-appearance:none;appearance:none;margin:0}
  #time::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  #time::-moz-range-track{height:1px;background:var(--ink)}
  #time::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:9px;border-radius:50%;background:var(--ink);border:1px solid var(--bg);margin-top:-4px}
  #time::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--ink);border:1px solid var(--bg)}
  #time:focus-visible{outline:1px dashed var(--ink);outline-offset:6px}
  .sig{color:var(--ink);background:var(--glass);padding:4px 0;text-transform:none;letter-spacing:.04em}
  .key{color:var(--ink-dim);background:var(--glass);padding:4px 0;letter-spacing:.06em}

  @media (max-width:820px){
    #traits{display:none}
    #panel{left:22px;right:22px;top:auto;bottom:calc(62px + env(safe-area-inset-bottom,0px));width:auto;max-height:36vh;overflow:auto}
    .key,.sig{display:none}
  }
  @media (prefers-reduced-motion:reduce){ .node{transition:none} }
</style>
</head>
<body>
<div id="stage"><svg id="tree" viewBox="-520 -520 1040 1040" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tree of the trilobite orders, as a spiral, a timeline or a family tree: time runs along the line from 542 to 251 million years ago, each lineage is a line that follows it"></svg></div>

<div class="hud" id="top">
  <a class="btn" id="gen" href="/">Universal Trilobite Generator</a>
  <div id="views" role="group" aria-label="Layout"><button class="btn on" type="button" aria-pressed="true">Spiral</button><button class="btn" type="button" aria-pressed="false">Timeline</button><button class="btn" type="button" aria-pressed="false">Tree</button><button class="btn" type="button" aria-pressed="false">Earth</button></div>
  <button class="btn" id="play" type="button" aria-pressed="false" title="Run through all the layouts (P)">Play</button>
  <div class="k">TREE <span>  542 Ma to 251 Ma  one drawing, four layouts</span></div>
</div>

<div class="hud" id="panel">
  <h2>Trilobite Morphospace</h2>
  <dl>
    <dt>Lineage</dt><dd id="p-name"></dd>
    <dt>Rank</dt><dd id="p-rank"></dd>
    <dt>Range</dt><dd id="p-range"></dd>
    <dt>Parent</dt><dd id="p-parent"></dd>
    <dt>Preset</dt><dd id="p-preset"></dd>
    <dt>Reading</dt><dd id="p-reading"></dd>
    <dt>Δ</dt><dd id="p-diff"></dd>
    <dt>Chars</dt><dd id="p-feat"></dd>
  </dl>
  <dl>
    <dt>Fits</dt><dd id="p-fits"><span class="dim">—</span></dd>
    <dt>Window</dt><dd id="p-win"><span class="dim">—</span></dd>
  </dl>
  <div class="btns">
    <a class="btn primary" id="p-open" href="#open">Open</a>
    <button class="btn" id="p-child" type="button">Save as child</button>
  </div>
  <p class="note" id="p-note"></p>
</div>

<div class="hud" id="traits"></div>

<div class="hud" id="bottom">
  <div class="now"><b id="now-ma">542 Ma</b><span id="now-period">E Cambrian</span></div>
  <input type="range" id="time" min="251" max="542" step="0.5" value="542" aria-label="Time, millions of years ago">
  <div class="key">● preset  ○ none  - - ?  dotted = not modelled</div>
  <div class="sig">Claire Choi  Cornell</div>
</div>

<script>
// ---- three layouts of one drawing: SPIRAL -> TIMELINE -> TREE.
// SPIRAL: time runs INWARD, 542 Ma on the outer rim, 251 Ma at the centre. A gentler-than-golden logarithmic
// spiral (b = 0.124 per radian vs 0.306 for phi) over 1.75 turns; self-similar, so the camera can follow it in.
// TIMELINE: the same spiral unwound into a straight line, left = 542 Ma, right = 251 Ma; lineages hang under it.
// TREE: the lineages spread into rows around their parents (a traditional family tree); the line stays as the time axis.
// U = how far the spiral is unwound (0..1), V = how far the lanes have spread into tree rows (0..1).
// At U = 0 every position is the original spiral's.
const T0 = 542, T1 = 251, TURNS = 1.75, R_OUT = 470, R_IN = 120;
const TH_MAX = TURNS*2*Math.PI, B = Math.log(R_OUT/R_IN)/TH_MAX;
const LANE = 0.034;                                          // radial step between lanes, as a fraction of r
const th = t => (T0 - t)/(T0 - T1) * TH_MAX;               // angle along the spiral for a date
const tOf = theta => T0 - theta/TH_MAX*(T0 - T1);
const BETA = Math.atan(B);                                   // the spiral's pitch: its tangent leans this far inward
const W_LINE = 960, C_LINE = W_LINE/TH_MAX;                  // the timeline's length, and its length per radian
const LW = 20, ROW = 20, S_LINE = 1.15;                       // lane step under the timeline, tree row step, mark/text scale off the spiral
let U = 0, V = 0, G = 0;                                    // G = how far the spiral has closed into the Earth circle (only from the spiral: U = 0)
const R_E = 330;                                             // the circle's radius
const aE = theta => theta*(1 - G*(1 - 1/TURNS)) - Math.PI/2 + 2*Math.PI*G;   // 1.75 turns wind down to one, with one full spin on the way
const rad0 = (theta, lane=0) => R_OUT*Math.exp(-B*theta) * Math.pow(1 - LANE, lane);
const XY0 = (theta, lane=0) => { const rr=rad0(theta,lane), a=theta - Math.PI/2; return [rr*Math.cos(a), rr*Math.sin(a)]; };
const heading = theta => G > 0 ? aE(theta) + Math.PI/2 + (1-G)*BETA : (1-U)*(theta + BETA);               // direction of travel along the trunk (screen angle, 0 = right)
const laneDir = theta => G > 0 ? aE(theta) + Math.PI : heading(theta) + Math.PI/2 - (1-U)*BETA;   // the side the lanes lie on (towards the centre on the spiral)
function trunk(theta){                                       // the trunk: speed blends spiral -> constant, heading unwinds; closed form
  const k = 1-U, cb = Math.cos(k*BETA), sb = Math.sin(k*BETA), E = Math.exp(-B*theta);
  const a = E*Math.cos(k*theta) - 1, b = E*Math.sin(k*theta), den = B*B + k*k, A = k*R_OUT*Math.sqrt(1 + B*B);
  let x = A*(-a*B + b*k)/den, y = A*(-b*B - a*k)/den;        // integral of e^(-B t) e^(i k t)
  if(k > 1e-9){ x += U*C_LINE*Math.sin(k*theta)/k; y += U*C_LINE*(1 - Math.cos(k*theta))/k; } else x += U*C_LINE*theta;
  return [U*(-W_LINE/2) + x*cb - y*sb, (1-U)*(-R_OUT) + U*(1-V)*Y_LINE + x*sb + y*cb];
}
// where something sits across the lanes: a number = a lane on the trunk's side of things; a lineage = its own lane and tree row
const spec = o => typeof o === 'number' ? {lane:o, row:TRUNK_ROW + o*LW} : o;
function off(theta, o){ o = spec(o); return (1-U)*R_OUT*Math.exp(-B*theta)*(1 - Math.pow(1-LANE, o.lane)) + U*((1-V)*LW*o.lane + V*o.row); }
const tang = theta => heading(theta) - (G > 0 ? 1-G : 1-U)*BETA;      // heading without the spiral's inward lean: what marks and names turn with
const XY = (theta, o=0) => {
  if(G > 0){ const lane=spec(o).lane, k=lane < 0 ? 1 : 1-G, a=aE(theta);                        // lanes fold onto the circle; marks outside it stay outside
    const rr=((1-G)*R_OUT*Math.exp(-B*theta) + G*R_E)*(1 - k*(1 - Math.pow(1-LANE,lane))); return [rr*Math.cos(a), rr*Math.sin(a)]; }
  if(U === 0) return XY0(theta, spec(o).lane);
  const [x,y] = trunk(theta), d = laneDir(theta), r = off(theta, o); return [x + r*Math.cos(d), y + r*Math.sin(d)]; };
const scl = (theta, lane=0) => G > 0 ? (1-G)*Math.exp(-B*theta)*Math.pow(1-LANE, lane) + G*0.85 : (1-U)*Math.exp(-B*theta)*Math.pow(1-LANE, lane) + U*S_LINE;   // size of marks and text there
const per = (theta, lane=0) => G > 0 ? (1-G)*rad0(theta, lane) + G*R_E/TURNS : (1-U)*rad0(theta, lane) + U*C_LINE;                           // length along a lane per radian
const spiralPath = (t_a, t_b, o, rev=false) => {
  let a=th(t_a), b=th(t_b); const n=Math.max(4, Math.ceil(Math.abs(b-a)/0.05)); const pts=[];
  for(let i=0;i<=n;i++){ pts.push(XY(a+(b-a)*i/n, o)); }
  if(rev) pts.reverse();
  return 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
};

const PERIODS = [["Cambrian",542,488],["Ordovician",488,444],["Silurian",444,416],["Devonian",416,359],["Carboniferous",359,299],["Permian",299,251]];
const SUB = {ECam:542,MCam:513,LCam:501,EOrd:488,MOrd:472,LOrd:461,LSil:423,MDev:398,LDev:385,LPer:260};
const END = {ECam:513,MCam:501,LCam:488,EOrd:472,MOrd:461,LOrd:444,LSil:416,MDev:385,LDev:359,LPer:251};
const EPOCHS = [[542,'Early Cambrian'],[513,'Middle Cambrian'],[501,'Late Cambrian'],[488,'Early Ordovician'],[472,'Middle Ordovician'],[461,'Late Ordovician'],[444,'Early Silurian'],[428,'Middle Silurian'],[423,'Late Silurian'],[416,'Early Devonian'],[398,'Middle Devonian'],[385,'Late Devonian'],[359,'Early Carboniferous'],[326,'Late Carboniferous'],[299,'Early Permian'],[270,'Late Permian']];
const epochOf = t => EPOCHS.filter(([a])=>a>=t).slice(-1)[0][1];

// ---- the tree: id, name, rank, parent, [first, last] as Gon's stage codes, preset?, uncertain origin?
const N = [
  ["redlichiida","Redlichiida","order",null,"ECam","MCam",true],
    ["olenellina","Olenellina","suborder","redlichiida","ECam","ECam",false],
    ["redlichiina","Redlichiina","suborder","redlichiida","ECam","MCam",false],
  ["agnostida","Agnostida","order","redlichiida","ECam","LOrd",true],
    ["eodiscina","Eodiscina","suborder","agnostida","ECam","MCam",false],
    ["agnostina","Agnostina","suborder","agnostida","ECam","LOrd",false],
  ["corynexochida","Corynexochida","order","redlichiida","ECam","LDev",true],
    ["corynexochina","Corynexochina","suborder","corynexochida","ECam","LCam",false],
    ["leiostegiina","Leiostegiina","suborder","corynexochida","MCam","EOrd",false],
    ["illaenina","Illaenina","suborder","corynexochida","LCam","LDev",false],
  ["lichida","Lichida","order","corynexochida","MCam","MDev",true,true],
  ["odontopleurida","Odontopleurida","order","lichida","MCam","LDev",true],
  ["ptychopariida","Ptychopariida","order","redlichiida","ECam","LDev",true],
    ["ptychopariina","Ptychopariina","suborder","ptychopariida","ECam","MOrd",false],
    ["olenina","Olenina","suborder","ptychopariida","LCam","LOrd",false],
  ["asaphida","Asaphida","order","ptychopariida","MCam","LSil",true],
  ["harpetida","Harpetida","order","ptychopariida","LCam","LDev",true],
  ["proetida","Proetida","order","ptychopariida","LCam","LPer",true],
  ["phacopida","Phacopida","order","ptychopariida","EOrd","LDev",true,true],
    ["calymenina","Calymenina","suborder","phacopida","EOrd","LDev",false],
    ["cheirurina","Cheirurina","suborder","phacopida","EOrd","LDev",false],
    ["phacopina","Phacopina","suborder","phacopida","MOrd","LDev",false],
      ["phacopoidea","Phacopoidea","superfamily","phacopina","MOrd","LDev",false],
      ["dalmanitoidea","Dalmanitoidea","superfamily","phacopina","MOrd","LDev",false],
      ["acastoidea","Acastoidea","superfamily","phacopina","MOrd","LDev",false],
].map(([id,name,rank,parent,a,b,has,unc])=>({id,name,rank,parent,t0:SUB[a],t1:END[b],has,unc:!!unc,kids:[]}));
const byId = Object.fromEntries(N.map(n=>[n.id,n]));
N.forEach(n=>{ if(n.parent) byId[n.parent].kids.push(n); });

// ---- characters: which lineage the guide credits with each, drawn on the branch where that lineage begins.
// glyph, name, generator parameter (or null = not modelled), guide page. The same glyph on unrelated branches is homeomorphy.
// key = the schema.CHARACTERS bundle that makes the generator show it (sent as ?chars=); head = a head style instead
// (the brim is a shaped head, not a parameter); param is what the hover text names.
const FEAT = {
  eye:   {name:"holochroal eyes",   param:"lensD",          p:23, key:"holochroalEyes"},
  schiz: {name:"schizochroal eyes", param:"lensD·lensGap",  p:73, key:"schizochroalEyes"},
  blind: {name:"eyes lost",         param:"eyeSize=0",      p:43, key:"eyesLost"},
  big:   {name:"pelagic eyes",      param:"eyeSize·eyeArc", p:44, key:"pelagicEyes"},

const RAD = Math.PI/180;
function proj(x,y,z){                                        // unit vector (x to lon 0, z north) -> [sx, sy, depth]

  const x1=x*cl + y*sl, y1=-x*sl + y*cl;                     // x1 towards us at the equator, y1 east
  return [R_G*y1, -R_G*(cf*z - sf*x1), sf*z + cf*x1];
}

function drawGlobe(){

  for(const p of LAND){ const q=proj(p[0],p[1],p[2]); if(q[2] <= 0.02) continue; const s=`M${q[0].toFixed(1)},${q[1].toFixed(1)}h0`; if(p[3]) b+=s; else a+=s; }
  landEl.setAttribute('d',a); highEl.setAttribute('d',b);
  let g='';
  for(const line of GRAT){ let pen=false; for(const p of line){ const q=proj(p[0],p[1],p[2]); if(q[2] <= 0){ pen=false; continue; } g+=(pen?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1); pen=true; } }
  gratEl.setAttribute('d',g);
  PLATES.forEach(p=>{ const q=proj(p.v[0],p.v[1],p.v[2]); p.el.style.display = q[2] > 0.25 ? '' : 'none'; p.el.style.opacity = Math.min(1, (q[2]-0.25)*2.2); set(p.el,{x:q[0].toFixed(1), y:q[1].toFixed(1)}); });
  SITES.forEach(s=>{ const q=proj(s.v[0],s.v[1],s.v[2]); s.el.style.display = q[2] > 0.05 ? '' : 'none'; s.el.setAttribute('transform',`translate(${q[0].toFixed(1)},${q[1].toFixed(1)})`); });
}
const periodOf = t => PERIODS.find(([,a,b]) => t <= a && t > b) || PERIODS[PERIODS.length-1];

function siteFits(fits){                                     // locate: light the sites where a fitting lineage is found, dim the rest (null = no filter)
  SITES.forEach(s=>{ const ok = !!fits && s.lin.some(m=>fits.includes(m)); s.el.classList.toggle('fit', ok); s.el.classList.toggle('nofit', !!fits && !ok); });
  const hit = fits && SITES.find(s=>s.lin.some(m=>fits.includes(m)));

const under = (n, top) => { while(n){ if(n === top) return true; n = byId[n.parent]; } return false; };

  const hit = only || (n && SITES.find(s=>s.lin.some(m=>under(m,n))));
  if(hit && G > 0.5) rotGoal = {lon:hit.lon, lat:Math.max(-50, Math.min(50, hit.lat*0.6))};

// ---- put everything where the current layout (U, V, G) says

    set(line,{x1:x0,y1:y0,x2:x0+7*cx,y2:y0+7*cy});
    const lx=x0+11*cx, ly=y0+11*cy, rot=out + U*Math.PI/2, flip=Math.cos(rot)<-1e-9, deg=rot*DEG;       // radial on the spiral, level on the line
    set(tx,{'font-size':Math.max(5.5, 8.5*Math.min(1,scl(theta))),x:lx,y:ly,transform:`rotate(${flip?deg+180:deg} ${lx} ${ly})`,'text-anchor':flip?'end':'start'});
  });

  set(endA,{cx:ax,cy:ay,r:2.6*scl(0)}); set(endB,{cx:bx,cy:by,r:2.6*scl(TH_MAX)});
  { const theta=-0.07*(1-U), [x0,y0]=XY(theta,0), out=laneDir(theta)+Math.PI, d=11+33*U, lx=x0+d*Math.cos(out), ly=y0+d*Math.sin(out);
    const rot=out + U*Math.PI/2, flip=Math.cos(rot)<-1e-9, deg=rot*DEG;
    set(first,{'font-size':8.5,x:lx,y:ly,transform:`rotate(${flip?deg+180:deg} ${lx} ${ly})`,'text-anchor':flip?'end':'start'}); }
  { const out=laneDir(TH_MAX)+Math.PI;                                                                   // spiral: at the centre; line: over its right end
    set(c,{'font-size':4+4.5*U, x:U*(bx+18*Math.cos(out)), y:(1-U)*1.5 + U*(by+18*Math.sin(out))}); c.style.textAnchor = U>0.5?'end':'middle'; }

// ---- the camera. On the spiral the viewBox follows the point inward; zoom = (rim radius / local radius)^1.8 so the
// last turn fills the screen. Off the spiral the whole drawing is in view.
let T = T0, target = {x:0,y:0,w:1040}, view = {x:0,y:0,w:1040}, moved=false;
const FULL = 1040;
function aspect(){ const r=svg.getBoundingClientRect(); return Math.max(.3, r.width/Math.max(1,r.height)); }
function camera(t){

  if(step && rollUp(step)){                                   // rolling the tree back up: keep the whole turning drawing in view
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; const far=FAR();
    for(let i=0;i<=48;i++){ for(const o of [0, far]){ const [x,y]=XY(TH_MAX*i/48, o); x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); } }
    const cx=(x0+x1)/2, cy=(y0+y1)/2, r=Math.hypot(x1-x0, y1-y0)/2 + 20, e=1-U, f=fitBox(cx-r, cx+r, cy-r, cy+r);
    const m=Math.min(1, 4*e*(1-e)*1.6);                         // all the way to the fitted view in the middle, the usual views at both ends

function fit(){                                               // the line / tree, whole

function fitBox(x0,x1,y0,y1){                                 // a box of the drawing, in the part of the screen the panels leave free

const FAR = () => ({lane:LANE_MAX+0.5, row:ROW_MAX+ROW*0.6});
function placeCursor(t){

function placeLabels(t){
  const now = th(t);

    const a0=th(n.t0), a1=th(n.t1), p0=per(a0,n.lane), s0=scl(a0,n.lane);

    const row = (10 + MARK_GAP*(n.feats.length+1))*Math.sqrt(s0)/p0;
    let ta = Math.max(a0 + (n.feats.length ? row : 10/p0), now + 8/per(now,n.lane));   // ahead of the cursor, after the marker row
    let dth = len/per(ta,n.lane);
    const lim = a1 - 0.02 + U*V*2;                           // in the tree every lineage has its own row, so a name may run past a short line
    if(ta + dth > lim){ ta = Math.max(a0 + 10/p0, lim - dth); dth = Math.min(dth, lim - ta); }
    if(dth <= 0.01){ n.lblText.style.display='none'; return; }
    n.lblText.style.display='';
    const lower = U === 0 && G === 0 ? XY(ta+dth/2,n)[1] > 0 : Math.cos(tang(ta+dth/2)) < -1e-9;   // would read upside down
    const sz=SIZE[n.rank]*scl(ta,n.lane);
    n.lblPath.setAttribute('d', spiralPath(tOf(ta), tOf(ta+dth), n, lower));
    n.lblText.setAttribute('font-size', sz); n.lblText.setAttribute('dy', lower ? -sz*0.25 : sz*0.85);
    n.lblTP.setAttribute('startOffset', lower ? '100%' : '0'); n.lblTP.setAttribute('text-anchor', lower ? 'end' : 'start');

function setTime(t, {animate=true}={}){

  document.getElementById('now-ma').textContent = Math.round(T)+' Ma';

// ---- the layout switch. Four layouts; five direct animations between them:
//   spiral <-> earth     the spiral spins and closes into the globe's outline
//   spiral <-> timeline  the spiral flattens into the line
//   timeline <-> tree    the lanes branch out into rows
//   tree -> spiral       the tree spins once and its rows roll back up into the spiral
// Any other change is a route through these (spiral -> tree: line, then tree; earth -> tree: spiral, line, tree).
// Play runs the loop earth, spiral, timeline, tree, (spin) spiral, earth, ... with a pause at each.
const MODES = ['spiral','line','tree','earth'], STEP_MS = 1500, HOLD_MS = 1300;
const STATE = {spiral:[0,0,0], line:[1,0,0], tree:[1,1,0], earth:[0,0,1]};                 // U, V, G
const NEXT = {spiral:{line:'line', tree:'line', earth:'earth'}, line:{spiral:'spiral', tree:'tree', earth:'spiral'},
              tree:{line:'line', spiral:'spiral', earth:'spiral'}, earth:{spiral:'spiral', line:'spiral', tree:'spiral'}};
const PLAY = ['earth','spiral','line','tree','spiral'];
let at = 'spiral', goal = 'spiral', step = null, SPIN = 0, SPIN_C = [0,0], playing = false, playIdx = 0, hold = 0, lastFrame = 0;
const ease = x => x*x*(3 - 2*x);
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const rollUp = s => s.a === 'tree' && s.b === 'spiral';
function pose(){                                             // set U, V, G (and the spin) from where the animation is, and redraw
  SPIN = 0;
  if(!step) [U,V,G] = STATE[at];
  else { const e = ease(Math.min(1, step.p)), a = STATE[step.a], b = STATE[step.b];
    if(rollUp(step)){ U = 1-e; V = 1; G = 0; SPIN = 360*e; }
    else { U = a[0]+(b[0]-a[0])*e; V = a[1]+(b[1]-a[1])*e; G = a[2]+(b[2]-a[2])*e; } }
  layout();                                                  // (the camera finds the centre the spin turns about)
  gAll.setAttribute('transform', SPIN ? `rotate(${SPIN.toFixed(2)} ${SPIN_C[0].toFixed(1)} ${SPIN_C[1].toFixed(1)})` : '');
}
function goMode(k, {animate=true, user=true}={}){
  goal = MODES[k]; if(user) setPlay(false);
  document.querySelectorAll('#views button').forEach((b,i)=>{ b.classList.toggle('on', i===k); b.setAttribute('aria-pressed', i===k); });
  try{ history.replaceState(null,'', k ? '#'+MODES[k] : location.pathname+location.search); }catch(_){}
  if(step && goal === step.a && !rollUp(step)) step = {a:step.b, b:step.a, p:1-step.p};      // turned back half way: run it backwards
  if(!animate || still()){ at = goal; step = null; pose(); view={...target}; applyView(); }
}
function setPlay(on){
  playing = on; hold = 0;
  const b = document.getElementById('play'); b.textContent = on ? 'Stop' : 'Play'; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  if(on){ playIdx = at === 'spiral' ? 0 : (PLAY.indexOf(at)+1) % PLAY.length; goMode(MODES.indexOf(PLAY[playIdx]), {user:false}); }
}
document.querySelectorAll('#views button').forEach((b,i)=> b.addEventListener('click', ()=>goMode(i)));
document.getElementById('play').addEventListener('click', ()=>setPlay(!playing));
function advance(dt){
  if(!step && at !== goal) step = {a:at, b:NEXT[at][goal], p:0};
  if(step){ step.p += dt/STEP_MS; if(step.p >= 1){ at = step.b; step = null; } pose(); }
  else if(playing){ hold += dt; if(hold >= HOLD_MS){ hold = 0; playIdx = (playIdx+1) % PLAY.length; goMode(MODES.indexOf(PLAY[playIdx]), {user:false}); } }
}
(function tick(now){
  const dt = Math.min(60, (now||0) - lastFrame); lastFrame = now||0;
  advance(dt);
  const k = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0.12;
  if(rotGoal){ const dl=((rotGoal.lon - lon0 + 540) % 360) - 180, df=rotGoal.lat - lat0;                // turn the globe to the chosen site
    if(Math.abs(dl) + Math.abs(df) < 0.2) rotGoal = null; else { lon0 += dl*k; lat0 += df*k; if(G > 0) drawGlobe(); } }
  view.x += (target.x-view.x)*k; view.y += (target.y-view.y)*k; view.w += (target.w-view.w)*k;
  applyView(); requestAnimationFrame(tick);
})(0);
addEventListener('resize', ()=>{ camera(T); applyView(); });

// ---- moving the point: drag anywhere on the stage, scroll, keys, slider. On the spiral the drag reads the angle from
// the centre (unwrapped to the nearest turn); off it, the position along the line.
const stage = document.getElementById('stage');
function svgPoint(e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
let drag=null;
stage.addEventListener('pointerdown', e=>{ if(e.button!==0) return; drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY}; moved=false; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 4) return;
  moved=true; stage.classList.add('dragging');
  if(G > 0.5){ const k=0.28*Math.min(1, 700/Math.max(200, svg.getBoundingClientRect().height));           // on the Earth the drag turns the globe
    lon0 -= (e.clientX-drag.lx)*k; lat0 = Math.max(-70, Math.min(70, lat0 + (e.clientY-drag.ly)*k)); drag.lx=e.clientX; drag.ly=e.clientY; rotGoal=null; drawGlobe(); return; }
  const p=svgPoint(e);
  if(U > 0.5){ setTime(tOf(Math.max(0, Math.min(TH_MAX, (p.x + W_LINE/2)/C_LINE)))); return; }
  let a=Math.atan2(p.y,p.x)+Math.PI/2; if(a<0) a+=2*Math.PI;      // angle on the spiral, mod 2pi
  const cur=th(T); let best=a, bd=Infinity;
  for(let k=-1;k<=Math.ceil(TURNS)+1;k++){ const cand=a+2*Math.PI*k, d=Math.abs(cand-cur); if(d<bd && d<Math.PI){bd=d;best=cand;} }
  if(bd<Infinity) setTime(tOf(Math.max(0,Math.min(TH_MAX,best))));

const endDrag = e=>{ drag=null; stage.classList.remove('dragging'); setTimeout(()=>moved=false,0); };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('wheel', e=>{ e.preventDefault(); setTime(T - Math.sign(e.deltaY)*3); }, {passive:false});
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); setTime(T+5); }
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); setTime(T-5); }
  if(e.key==='Home'){ setTime(T0); } if(e.key==='End'){ setTime(T1); }
  if(e.key>='1' && e.key<='4') goMode(+e.key-1);
  if(e.key==='p'||e.key==='P') setPlay(!playing);
});
document.getElementById('time').addEventListener('input', e=>setTime(+e.target.value));

const code = (tbl,v) => Object.entries(tbl).find(([,x])=>x===v)[0];

const want = new Set();

N.forEach(n=>{ n.cum = new Set(n.feats); let p=n; while(p.parent){ p=byId[p.parent]; p.feats.forEach(f=>n.cum.add(f)); }
  if(n.cum.has('blind') || n.cum.has('schiz')) n.cum.delete('eye'); });   // a lineage that lost its eyes, or changed eye type, no longer has the ancestral holochroal eye
// which characters each preset's own model shows (schema.characters): tells "the model looks like this" from "inherited on the tree"
let PCH = null; fetch('/api/preset_chars').then(r=>r.json()).then(d=>{ PCH=d; if(want.size) locate(); }).catch(()=>{});
const shows = (n,f) => { const a=ancestorWithPreset(n); return FEAT[f].head ? a.id==='harpetida' : !!(PCH && PCH[a.id] && PCH[a.id].includes(FEAT[f].key)); };
// the generator link for a lineage with the chosen options applied on top: the opened animal always shows them
function openHref(n){ const a=ancestorWithPreset(n), ks=[...want].map(f=>FEAT[f].key).filter(Boolean), hd=[...want].map(f=>FEAT[f].head).filter(Boolean)[0];
  return `/?preset=${a.id}` + (ks.length ? '&chars='+ks.join(',') : '') + (hd ? '&head='+hd : ''); }

const strip = document.getElementById('traits');
Object.keys(FEAT).forEach(f=>{
  const b=document.createElement('button'); b.type='button'; b.disabled=!FEAT[f].param;
  b.title=FEAT[f].name+'\u2002\u2002'+(FEAT[f].param||'not modelled')+'\u2002\u2002Gon p.'+FIG[f].p;
  const im=document.createElement('img'); im.src=FIG[f].src; im.alt=FEAT[f].name; im.draggable=false; b.append(im);
  const cap=document.createElement('span'); cap.textContent=FIG[f].cap; b.append(cap);
  b.addEventListener('click',()=>{ want.has(f)?want.delete(f):want.add(f); b.classList.toggle('on',want.has(f)); locate(); });
  strip.append(b);
});
function locate(){
  const fits = want.size ? N.filter(n=>[...want].every(f=>n.cum.has(f))) : [];
  N.forEach(n=>{ n.el.classList.toggle('nofit', want.size>0 && !fits.includes(n)); n.el.classList.toggle('fit', fits.includes(n)); });
  const F=document.getElementById('p-fits'), W=document.getElementById('p-win');
  if(!want.size){ F.innerHTML='<span class="dim">—</span>'; W.innerHTML='<span class="dim">—</span>'; band=null; gBand.setAttribute('d',''); siteFits(null);
    const cur=N.find(m=>m.el.classList.contains('sel')); if(cur) select(cur); return; }   // options cleared: the Open link goes back to the plain preset
  if(!fits.length){ F.innerHTML='<span class="dim">none</span>'; W.innerHTML='<span class="dim">—</span>'; band=null; gBand.setAttribute('d',''); siteFits([]); return; }
  const tips = fits.filter(n=>!fits.some(m=>m!==n && m.parent && (function(x){ while(x){ if(x===n) return true; x=byId[x.parent]; } return false; })(byId[m.parent])));
  F.textContent = tips.slice(0,4).map(n=>n.name).join('\u2002\u2002') + (tips.length>4 ? ` +${tips.length-4}` : '');
  const ta=Math.max(...fits.map(n=>n.t0)), tb=Math.min(...fits.map(n=>n.t1));
  const abbr = c => c[0]+' '+LONG[c.slice(1)];
  W.textContent = abbr(code(SUB,ta))+' – '+abbr(code(END,tb))+`\u2002\u2002${ta}–${tb} Ma`;
  band=[ta,tb]; gBand.setAttribute('d', spiralPath(ta,tb,0));                                     // the window: the trunk drawn solid
  // route the panel and its Open button to the fitting lineage whose own model shows the most of what was chosen
  // first where the guide puts the feature on the tree (not merely inherited), then whose model shows it, then one with its own preset
  const score = n => [...want].filter(f=>n.feats.includes(f)).length*8 + [...want].filter(f=>shows(n,f)).length*4 + (n.has?2:0) + (tips.includes(n)?1:0);
  const best = fits.slice().sort((a,b)=>score(b)-score(a))[0];
  select(best); siteFits(fits);
  const native = [...want].filter(f=>shows(best,f)), added = [...want].filter(f=>!shows(best,f));
  document.getElementById('p-diff').innerHTML = (native.length ? native.map(f=>FEAT[f].name).join('\u2002')+' <span class="dim">in the model</span>' : '')
    + (added.length ? (native.length?'<br>':'') + added.map(f=>FEAT[f].name).join('\u2002')+' <span class="dim">added on Open</span>' : '');
  setTime(ta);
}

// ---- the panel
const longName = c => LONG[c[0]]+' '+LONG[c.slice(1)];
function ancestorWithPreset(n){ let p=n; while(p && !p.has) p = byId[p.parent]; return p; }
function selectSite(s){   // a fossil site on the globe: what the guide places there
  N.forEach(m=>m.el.classList.remove('sel')); EYES.forEach(y=>y.el&&y.el.classList.remove('sel'));
  const n = s.lin[0], anc = ancestorWithPreset(n), dim = t => `<span class="dim">${t}</span>`;
  document.getElementById('p-name').textContent = s.name;
  document.getElementById('p-rank').textContent = 'fossil site';
  document.getElementById('p-range').textContent = s.age;
  document.getElementById('p-parent').innerHTML = `${s.place} <span class="dim">\u2002then ${s.plate}</span>`;
  document.getElementById('p-preset').innerHTML = s.lin.map(m=>m.name).join('\u2002\u2002');
  document.getElementById('p-reading').innerHTML = dim('—');
  document.getElementById('p-diff').innerHTML = dim('Gon p.'+s.p);
  document.getElementById('p-feat').textContent = s.taxa;
  const open=document.getElementById('p-open'); open.textContent = `Open ${anc.id}`; open.href = `/?preset=${anc.id}`;
  document.getElementById('p-child').textContent = 'Save as child';
  markSites(null, s); setTime(s.t);
}
function selectEye(x){   // an eye-type node: a preset that opens the generator with that eye configuration
  N.forEach(m=>m.el.classList.remove('sel')); EYES.forEach(y=>y.el&&y.el.classList.toggle('sel',y===x));
  document.getElementById('p-name').textContent = x.name;
  document.getElementById('p-rank').textContent = 'eye character';
  document.getElementById('p-range').textContent = epochOf(x.t)+'  '+Math.round(x.t)+' Ma';
  document.getElementById('p-parent').innerHTML = '<span class="dim">trilobite-wide</span>';
  document.getElementById('p-preset').innerHTML = x.key;
  document.getElementById('p-reading').innerHTML = '<span class="dim">—</span>';
  document.getElementById('p-diff').innerHTML = '<span class="dim">—</span>';
  document.getElementById('p-feat').innerHTML = x.name;
  const open=document.getElementById('p-open'); open.textContent='Open'; open.href='/?eye='+encodeURIComponent(x.key);
  document.getElementById('p-child').textContent='Save as child';
  markSites(null); setTime(x.t);
}
function select(n){
  N.forEach(m=>m.el.classList.toggle('sel',m===n)); EYES.forEach(y=>y.el&&y.el.classList.remove('sel'));
  const anc = ancestorWithPreset(n), par = n.parent ? byId[n.parent] : null;
  const abbr = c => c[0]+' '+LONG[c.slice(1)];
  document.getElementById('p-name').textContent = n.name;
  document.getElementById('p-rank').textContent = n.rank;
  document.getElementById('p-range').textContent = abbr(code(SUB,n.t0))+' – '+abbr(code(END,n.t1));
  document.getElementById('p-parent').innerHTML = (par?par.name:'<span class="dim">—</span>')+(n.unc?' <span class="dim">?</span>':'');
  document.getElementById('p-preset').innerHTML = n.has ? `${n.id}.json` : `<span class="dim">—\u2002\u2002from ${anc.id}</span>`;
  document.getElementById('p-reading').innerHTML = '<span class="dim">—</span>';
  document.getElementById('p-diff').innerHTML = '<span class="dim">—</span>';
  document.getElementById('p-feat').innerHTML = n.feats.length ? n.feats.map(f=>FEAT[f].param?FEAT[f].name:`<span class="dim">${FEAT[f].name}</span>`).join('\u2002\u2002') : '<span class="dim">—</span>';
  const open=document.getElementById('p-open'); open.textContent = (n.has ? 'Open' : `Open ${anc.id}`) + (want.size ? ' + options' : ''); open.href = openHref(n);
  document.getElementById('p-child').textContent = n.has ? 'Save as child' : `Save as ${n.id}`;
  markSites(n); setTime(n.t0);                              // the point goes to where this lineage begins
}
// in the app these are real links (web/app.py serves this page at /tree); in the mock-up they go nowhere
if(!/\/tree/.test(location.pathname)) document.querySelectorAll('a.btn').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
select(byId.redlichiida); setTime(T0,{animate:false});
goMode(Math.max(0, MODES.indexOf(location.hash.slice(1))), {animate:false, user:false});
</script>
