<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilobite Morphospace</title>
<style>
  :root{--bg:#000000;--ink:#ffffff;--mid:#9a9a9a;--line:#262626;--soft:#141414}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;overflow:hidden;font-size:12px}
  #app{display:grid;grid-template-columns:340px 1fr;height:100vh}
  .panel{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .controls{overflow-y:auto;padding:18px 20px;flex:1}
  h1{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:normal;margin:0 0 14px}
  .sect{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .ctrl{margin:9px 0}
  .ctrl .lab{display:flex;justify-content:space-between;margin-bottom:2px}
  .ctrl .lab span:last-child{color:var(--mid);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--ink);outline:none;margin:6px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:none;cursor:pointer}
  input[type=text]{width:100%;background:var(--bg);color:var(--ink);border:none;border-bottom:1px solid var(--line);padding:3px 0;font:inherit}
  input[type=text]:focus{outline:none;border-bottom-color:var(--ink)}
  select{width:100%;background:var(--bg);color:var(--ink);border:none;border-bottom:1px solid var(--ink);padding:6px 0;font:inherit;border-radius:0}
  .hint{color:var(--mid);font-size:11px;margin:6px 0 0}
  .more{color:var(--mid);cursor:pointer;margin-top:14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .actions{padding:14px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:8px 6px;font:inherit;cursor:pointer}
  button.primary{background:var(--ink);color:var(--bg)}
  button:hover{background:var(--soft)} button.primary:hover{opacity:.85} button:disabled{opacity:.35;cursor:default}
  .stage{position:relative;min-width:0;background:#000}
  canvas{display:block}
  img.sheet{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .stage3d{position:absolute;inset:0;display:none}
  #view3d{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid rgba(255,255,255,.5);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:0}
  #view3d.corner{background:var(--bg);border:1px solid var(--ink);padding:8px 14px;right:16px;top:16px;left:auto!important;bottom:auto!important;width:auto!important;height:auto!important}
  #view3d:hover{background:var(--ink);color:var(--bg)}
  .readout{position:absolute;left:16px;top:14px;line-height:1.6;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000, 0 0 6px #000}
  .readout b{font-weight:normal;border-bottom:1px solid var(--ink)}
  .status{position:absolute;right:16px;top:14px;color:var(--mid);text-shadow:0 0 6px #000} .status.busy{color:var(--ink)}
  .look{position:absolute;right:16px;top:36px;color:var(--mid);font-size:11px;letter-spacing:.06em;text-transform:uppercase;user-select:none;display:none}
  .look span{cursor:pointer} .look span.on{color:var(--ink);border-bottom:1px solid var(--ink)}
  .rollbar{position:absolute;left:16px;right:16px;bottom:16px;display:none;grid-template-columns:1fr auto auto;gap:14px;align-items:center}
  .rollbar input[type=range]{height:1px} .rollbar input[type=range]::-webkit-slider-thumb{width:16px;height:16px}
  .rollbar .val{min-width:120px;text-align:right;font-variant-numeric:tabular-nums}
  .loading{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;z-index:6}
  .loading.on{display:flex}
  .loading img{width:150px;height:auto;image-rendering:auto;opacity:.9}
  .loading .count{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);font-variant-numeric:tabular-nums}
  .loading .note{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.06em;color:var(--line)}
  svg.arm{width:100%;height:120px;display:block;margin:6px 0 2px;border:1px solid var(--line)}
  svg.arm text{fill:var(--mid);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  /* the anatomy map: the picker is the animal, traced from the dorsal sketch */
  svg.map{width:100%;display:block;margin-top:8px;border:1px solid var(--line);background:var(--bg);touch-action:none;user-select:none}
  svg.map text{fill:var(--mid);font-size:9px;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
  svg.map .reg{fill:#0b0b0b;stroke:var(--mid);stroke-width:1;cursor:pointer}
  svg.map .reg:hover{fill:var(--soft);stroke:var(--ink)}
  svg.map .reg.on{fill:var(--soft);stroke:var(--ink);stroke-width:1.5}
  svg.map .mir{fill:none;stroke:var(--line);stroke-width:1;pointer-events:none}
  svg.map .ink{fill:none;stroke:var(--ink);stroke-width:1.2;pointer-events:none;stroke-linecap:round}
  svg.map .dim{fill:none;stroke:var(--mid);stroke-width:.8;pointer-events:none}
  svg.map .ghost{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 2;pointer-events:none}
  svg.map .hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:12;cursor:pointer;pointer-events:stroke}
  svg.map .h{fill:var(--bg);stroke:var(--ink);stroke-width:1.2;cursor:grab}
  svg.map .h:hover{fill:var(--ink)}
  svg.map .h.two{cursor:move}
  svg.map .step{fill:var(--bg);stroke:var(--line);cursor:pointer}
  svg.map .step:hover{stroke:var(--ink)}
  svg.map .steplab{fill:var(--ink);font-size:12px;pointer-events:none}
  @media (max-width: 720px), (pointer: coarse) and (max-width: 1024px) {
    html,body{overflow:auto;font-size:14px}
    #app{display:flex;flex-direction:column;height:auto;min-height:100vh}
    .stage{order:0;height:52vh;min-height:300px;border-bottom:1px solid var(--line)}
    .panel{order:1;border-right:none}
    .controls{overflow:visible;padding:16px}
    .actions{position:sticky;bottom:0;background:var(--bg)}
    input[type=range]{height:2px;margin:12px 0}
    input[type=range]::-webkit-slider-thumb{width:22px;height:22px}
    input[type=range]::-moz-range-thumb{width:22px;height:22px}
    button{padding:12px 8px}
    svg.map .h{stroke-width:1.6}
    .readout{font-size:12px;left:12px;top:10px;max-width:70%}
    .rollbar{left:12px;right:12px;bottom:12px;gap:10px}
    svg.arm{height:150px}
  }
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <div class="controls">
      <h1>Trilobite Morphospace</h1>
      <div class="ctrl"><div class="lab"><span>Order</span></div><select id="preset"></select></div>
      <svg class="map" id="map" viewBox="0 0 300 372" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="sect" id="cellname"></div>
      <div id="C"></div>
      <div class="more" id="more">more</div>
    </div>
    <div class="actions">
      <button class="primary" id="buildBtn">Build</button>
      <button id="dl">Download STL</button>
    </div>
  </div>
  <div class="stage">
    <img class="sheet" id="sheet" alt="">
    <div class="stage3d" id="stage3d"></div>
    <button id="view3d" style="display:none">View 3D</button>
    <div class="readout" id="readout"></div>
    <div class="status" id="status"></div>
    <div class="look" id="look"><span class="on" data-look="blueprint">Blueprint</span> · <span data-look="model">Model</span></div>
    <div class="rollbar" id="rollbar"><input type="range" id="roll" min="0" max="45" step="0.1" value="0"><div class="val" id="rollval"></div><button id="go">Roll</button></div>
    <div class="loading" id="loading">
      <img src="/loading.gif" alt="">
      <div class="count" id="lcount"></div>
      <div class="note">(placeholder image until animation asset made)</div>
    </div>
  </div>
</div>

const C=$('C');

function fmt(v,m){return (m.kind==='int'||m.kind==='odd_int')?String(Math.round(v)):(+v).toFixed(m.step<0.01?3:m.step<0.1?2:m.step<1?1:0)+(m.unit?' '+m.unit:'');}

// ================================================================ the anatomy map
// Traced from the dorsal sketch: head up, tail down, the left side its dimmed mirror (c = mirror a).
// Filled regions pick a cell. The callouts the sketch labels — prong, eye R and arc, genal and
// pleural spine length, the w arrow, the head / thorax / tail brackets — are live handles, so the
// annotations ARE the controls. Sliders under the map stay for numeric precision.
const MAPW=300, MAPH=372;
let HND=[], drag=null;
const F=v=>(+v).toFixed(1);
function hnd(k,x,y,inv){ const i=HND.length; HND.push({k,inv}); return `<circle class="h" data-i="${i}" cx="${F(x)}" cy="${F(y)}" r="3.2"><title>${META[k].label}</title></circle>`; }

function drawMap(){

function fit(){ const box=new THREE.Box3().setFromObject(root); if(box.isEmpty()) return; const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3()).length();
  ctl.target.copy(c); cam.position.copy(c).add(new THREE.Vector3(0.6,0.55,0.95).multiplyScalar(s*0.9)); cam.near=s/100; cam.far=s*10; cam.updateProjectionMatrix(); }
function pose(th){ if(!kin||!threeReady) return; const zh=kin.hinge_z, offs=kin.offsets; let M=new THREE.Matrix4(); const rot=new THREE.Matrix4().makeRotationX(-th*Math.PI/180);
  kin.names.forEach((n,i)=>{ if(i>0){ M=M.clone().multiply(new THREE.Matrix4().makeTranslation(0,offs[i-1],0)).multiply(new THREE.Matrix4().makeTranslation(0,0,zh)).multiply(rot).multiply(new THREE.Matrix4().makeTranslation(0,0,-zh)); } const g=partMeshes[n]; if(g){g.matrixAutoUpdate=false; g.matrix.copy(M);} }); }
function highlight(row){ if(!threeReady) return; for(const [n,g] of Object.entries(partMeshes)){ const on=row&&(row==='seg'?n.startsWith('seg'):n===row); const e=g.getObjectByName('edges'); if(e) e.material.opacity=on?1.0:(row?0.35:0.9); } }
$('view3d').onclick=async()=>{ if(mode==='sheet'){ mode='3d'; $('sheet').style.display='none'; $('stage3d').style.display='block'; $('rollbar').style.display='grid'; $('look').style.display='block'; $('view3d').textContent='View sheet'; placeView3D(); await load3d(null); }
  else { mode='sheet'; $('stage3d').style.display='none'; $('rollbar').style.display='none'; $('look').style.display='none'; $('sheet').style.display='block'; $('view3d').textContent='View 3D'; placeView3D(); await sheet(); } };
function rollLabel(v){ const mx=+$('roll').max||1; return Math.round(100*v/mx)+'% · '+(+v).toFixed(1)+'° / joint'; }
$('roll').oninput=e=>{ $('rollval').textContent=rollLabel(+e.target.value); pose(+e.target.value); };
// ---- measure
$('go').onclick=async()=>{ status('measuring',true); $('go').disabled=true;
  try{ lastMeas=await post('/api/measure',{P}); kin=lastMeas.kinematics; readout(); status(`measured · ${lastMeas.limited_by}`,false);
    const th=lastMeas.theta_joint_deg; if(th!=null){ $('roll').max=Math.max(th,1); $('roll').value=th; $('rollval').textContent=rollLabel(th); }
    if(th!=null){ let x=0; const step=()=>{x=Math.min(th,x+th/60); pose(x); if(x<th) requestAnimationFrame(step);}; step(); }
  } catch(ex){ status('measure failed · '+why(ex),false); }
  finally { $('go').disabled=false; } };
$('roll').max=P.maxAngle; $('roll').value=P.maxAngle; $('rollval').textContent=rollLabel(P.maxAngle);
render(); build(); placeView3D();
</script>
</body>
