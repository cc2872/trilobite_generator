<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>trilobite — generator 6.0 / instrument 2.1</title>
<style>
body{margin:0;background:#0b0b0b;color:#e8e6df;font:14px/1.4 system-ui,sans-serif;display:grid;grid-template-columns:360px 1fr;height:100vh}
#panel{padding:12px;overflow:auto;border-right:1px solid #222}#view{position:relative}canvas{display:block}
h1{font-size:14px;font-weight:500;margin:0 0 8px;color:#8a897f}select,button,input[type=range],input[type=text]{font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:8px 0}.cell{background:#141414;border:1px solid #2c2c2a;border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:12px;color:#c9c6bb}
.cell.sel{border-color:#f0b040;color:#f0b040}.cell.mirror{color:#5a5952;cursor:default}.cell small{display:block;color:#5a5952;font-size:10px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row label{width:110px;font-size:12px;color:#c9c6bb}.row input{flex:1}.row span{width:52px;text-align:right;font-size:12px;color:#8a897f}
#doc{font-size:12px;color:#8a897f;margin:4px 0 8px}#more{font-size:12px;color:#8a897f;cursor:pointer}.card{border:1px solid #2c2c2a;border-radius:8px;padding:10px 12px;margin-top:10px}
.glyph{width:100%;display:block;margin:4px 0 6px}.tines{display:flex;gap:5px;margin:4px 0}.tines button,.segs button{background:#141414;border:1px solid #2c2c2a;color:#c9c6bb;border-radius:6px;padding:0}
.tines button{width:40px;height:40px}.tines button.on{border-color:#f0b040;color:#f0b040}.segs{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin:4px 0}.segs button{width:22px;height:40px;border-radius:4px}.segs .add{width:40px;border-radius:6px}
#go{width:100%;margin-top:8px;padding:10px;background:transparent;color:#e8e6df;border:1px solid #5a5952;border-radius:8px;cursor:pointer}#status{position:absolute;left:12px;top:10px;font-size:12px;color:#8a897f}
.big{font-size:22px;font-weight:500}.dim{color:#8a897f;font-size:12px}.sub{font-size:12px;color:#8a897f;margin:10px 0 2px}
</style></head><body>
<div id="panel">
<h1>trilobite</h1>
<div class="row"><label>order</label><select id="preset"></select></div>
<div class="grid" id="grid"></div>
<div id="cellname" style="color:#f0b040;font-weight:500"></div><div id="doc"></div><div id="controls"></div><div id="more">more…</div>
<button id="go">curl it</button>
<div class="card" id="read"><div class="dim">enrolment</div><div class="big" id="theta">—</div><div id="cls" class="dim">not measured</div><div id="print" class="dim"></div></div>
</div>
<div id="view"><div id="status"></div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const S = await (await fetch('/api/schema')).json(); const META = Object.fromEntries(S.params.map(p=>[p.key,p]));
let P = await (await fetch('/api/preset/'+S.default)).json(); let sel='frame', showMore=false, kin=null, partMeshes={}, limiting=null, buildTimer=null;
const GRID=[['b1','a1'],['b2','a2'],['b3','a3']]; const ROWOF={b1:'head',a1:'head',b2:'seg',a2:'seg',b3:'tail',a3:'tail'};
const NAMES={b1:'glabella',a1:'cheek + eye',b2:'axial rings',a2:'pleura',b3:'tail axis',a3:'tail margin'};
const gridEl=document.getElementById('grid'), C=document.getElementById('controls');
const frameBtn=mk('div','cell','body<small>frame</small>'); frameBtn.style.gridColumn='1 / span 3'; frameBtn.onclick=()=>{sel='frame';render();}; gridEl.appendChild(frameBtn);
for(const [b,a] of GRID){ for(const [c,mir] of [[a,false],[b,false],[a,true]]){ const d=mk('div','cell'+(mir?' mirror':''), (mir?NAMES[c]+'<small>'+c.replace('a','c')+' (mirror)</small>':NAMES[c]+'<small>'+c+'</small>')); d.dataset.c=c; if(!mir) d.onclick=()=>{sel=c;render();}; d.onmouseenter=()=>highlight(ROWOF[c]); d.onmouseleave=()=>highlight(null); gridEl.appendChild(d);} }
const rulerBtn=mk('div','cell','print + hinge<small>ruler</small>'); rulerBtn.style.gridColumn='1 / span 3'; rulerBtn.onclick=()=>{sel='ruler';render();}; gridEl.appendChild(rulerBtn);
function mk(t,cls,html){const e=document.createElement(t); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const ps=document.getElementById('preset'); S.presets.forEach(n=>{const o=mk('option',null,n);o.value=n;if(n===S.default)o.selected=true;ps.appendChild(o);});
ps.onchange=async()=>{P=await (await fetch('/api/preset/'+ps.value)).json(); render(); build();};
function fmt(v,m){return (m.kind==='int'||m.kind==='odd_int')?String(Math.round(v)):(+v).toFixed(m.step<0.01?3:m.step<0.1?2:m.step<1?1:0)+(m.unit?' '+m.unit:'');}
function set(k,v){P[k]=v; redrawGlyphs(); scheduleBuild();}
function slider(k, onchange){ const m=META[k]; const r=mk('div','row'); const v=P[k];
  if(m.kind==='expr'){ r.innerHTML=`<label title="${m.doc}">${m.label}</label><input type="text" value="${v}"><span></span>`; r.querySelector('input').onchange=e=>set(k,e.target.value); return r;}
  r.innerHTML=`<label title="${m.doc}">${m.label}</label><input type="range" min="${m.lo}" max="${m.hi}" step="${m.step}" value="${v}"><span>${fmt(v,m)}</span>`;
  const inp=r.querySelector('input'); inp.oninput=e=>{P[k]=+e.target.value; r.querySelector('span').textContent=fmt(P[k],m); redrawGlyphs();}; inp.onchange=()=>scheduleBuild(); return r; }
function sub(t){return mk('div','sub',t);}
// ---- glyphs: each control is a picture of the anatomy, redrawn from P
const GL={};
function svg(id,vb,h){const s=mk('div',null,`<svg id="${id}" class="glyph" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"></svg>`); GL[id]=1; return s;}
function redrawGlyphs(){ for(const id in GL){ const e=document.getElementById(id); if(!e){delete GL[id];continue;} DRAW[id](e);} }
const DRAW={
 prongHead:e=>prongGlyph(e,'head'), prongTail:e=>prongGlyph(e,'tail'),
 bodybar:e=>{const W=340,h=P.cephFrac*100,p=P.pygFrac*100,hw=W*h/100,pw=W*p/100; e.innerHTML=`<rect x="0" y="6" width="${hw}" height="22" rx="4" fill="#534AB7"/><rect x="${hw}" y="6" width="${W-hw-pw}" height="22" fill="#5F5E5A"/><rect x="${W-pw}" y="6" width="${pw}" height="22" rx="4" fill="#0F6E56"/><text x="8" y="21" font-size="11" fill="#e8e6df">head ${Math.round(h)}%</text><text x="${hw+8}" y="21" font-size="11" fill="#e8e6df">${Math.round(P.segCount)} segments</text><text x="${W-8}" y="21" font-size="11" fill="#e8e6df" text-anchor="end">tail ${Math.round(p)}%</text>`;},
 pleura:e=>{const inner=P.fulcrum, blade=1-P.fulcrum, dg=Math.atan(P.pleuralSlope*P.relief/Math.max(P.width*(1-P.axisFrac)/2,1))*180/Math.PI; const x0=40,y0=40,k=180,a=dg*Math.PI/180,x1=x0+inner*k,x2=x1+blade*k*Math.cos(a),y2=y0+blade*k*Math.sin(a);
  e.innerHTML=`<rect x="10" y="30" width="30" height="20" rx="4" fill="#534AB7"/><text x="25" y="44" font-size="11" fill="#e8e6df" text-anchor="middle">axis</text><path d="M${x0} ${y0} L${x1.toFixed(1)} ${y0} L${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="#1D9E75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x1.toFixed(1)}" cy="${y0}" r="4" fill="#888780"/><text x="${((x0+x1)/2).toFixed(1)}" y="${y0-10}" font-size="11" fill="#8a897f" text-anchor="middle">inner run</text><text x="${((x1+x2)/2+10).toFixed(1)}" y="${((y0+y2)/2-6).toFixed(1)}" font-size="11" fill="#8a897f">blade · overlap ${(P.overlap*100).toFixed(0)}%</text><text x="${(x1+4).toFixed(1)}" y="${y0+18}" font-size="11" fill="#8a897f">bend ${dg.toFixed(0)}°</text>`;},
 glab:e=>{const inf=P.glabInflate,rise=P.glabRise,n=Math.round(P.glabLobes),nF=P.glabFront||2.5; const cx=90,yb=110,yt=22,a0=14; let h=`<path d="M20 ${yb} C20 40 60 ${yt} ${cx} ${yt} C120 ${yt} 160 40 160 ${yb} Z" fill="none" stroke="#5a5952" stroke-width="1.2"/>`;
  const pts=[]; for(let i=0;i<=24;i++){const f=i/24,y=yb-(yb-yt)*f; let w=a0*(1+(inf-1)*f)*(1+0.10*Math.sin(Math.PI*f)); const fn=Math.min(Math.max((f-0.70)/0.30,0),1); w*=Math.pow(Math.max(1-Math.pow(fn,nF),0),1/nF); w*=0.75+0.25*Math.min(f/0.10,1); pts.push([cx-Math.max(w,0.35*a0),y,cx+Math.max(w,0.35*a0)]);}
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1]; for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1); for(let i=pts.length-1;i>=0;i--)d+=' L'+pts[i][2].toFixed(1)+' '+pts[i][1].toFixed(1);
  h+=`<path d="${d} Z" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/>`; for(let k=0;k<n;k++){const f=0.28+0.16*k,y=yb-(yb-yt)*f; const q=pts[Math.round(f*24)]; h+=`<line x1="${q[0].toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx-(cx-q[0])*0.45).toFixed(1)}" y2="${(y+3).toFixed(1)}" stroke="#CECBF6" stroke-width="2" stroke-linecap="round"/><line x1="${q[2].toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx+(q[2]-cx)*0.45).toFixed(1)}" y2="${(y+3).toFixed(1)}" stroke="#CECBF6" stroke-width="2" stroke-linecap="round"/>`;}
  const x0=200,x1=330,base=110,hR=22+rise*120; h+=`<path d="M${x0} ${base} C${x0+25} ${base-hR*0.6} ${x0+60} ${base-hR} ${x0+95} ${base-hR*0.9} C${x0+115} ${base-hR*0.7} ${x1-6} ${base-hR*0.3} ${x1} ${base}" fill="#3C3489" stroke="#AFA9EC" stroke-width="1.5"/><text x="${cx}" y="136" font-size="11" fill="#8a897f" text-anchor="middle">plan</text><text x="${(x0+x1)/2}" y="136" font-size="11" fill="#8a897f" text-anchor="middle">side · rise</text>`; e.innerHTML=h;},
 eye:e=>{const R=P.eyeSize*100, H=P.eyeHeight*R, arc=P.eyeArc; const cx=80,cy=60; let h=`<circle cx="${cx}" cy="${cy}" r="${R.toFixed(1)}" fill="none" stroke="#5a5952" stroke-dasharray="3 3"/>`; const a0=-arc/2*Math.PI/180,a1=arc/2*Math.PI/180; h+=`<path d="M${(cx+R*Math.cos(a0)).toFixed(1)} ${(cy+R*Math.sin(a0)).toFixed(1)} A${R.toFixed(1)} ${R.toFixed(1)} 0 ${arc>180?1:0} 1 ${(cx+R*Math.cos(a1)).toFixed(1)} ${(cy+R*Math.sin(a1)).toFixed(1)}" fill="none" stroke="#5DCAA5" stroke-width="5" stroke-linecap="round"/><text x="${cx}" y="${cy+R+16}" font-size="11" fill="#8a897f" text-anchor="middle">visual arc ${arc}°</text>`;
  const x0=200,b=100; h+=`<rect x="${x0}" y="${(b-H).toFixed(1)}" width="${(2*R).toFixed(1)}" height="${H.toFixed(1)}" rx="3" fill="#085041" stroke="#5DCAA5"/><text x="${x0+R}" y="${b+14}" font-size="11" fill="#8a897f" text-anchor="middle">height ${P.eyeHeight.toFixed(2)} × size</text>`; e.innerHTML=h;}
};
function prongGlyph(e,which){const d=Math.round(P[which+'Prongs']||0), L=(P[which+'ProngLen']||0.6)*110, s=P[which+'ProngStem']||0, sp=P[which+'ProngSplay']||30, c=P[which+'ProngCenter']||1, cu=P[which+'ProngCurl']||0;
  if(d===0){e.innerHTML=`<text x="170" y="64" font-size="12" fill="#5a5952" text-anchor="middle">no ${which} prong — pick a tine count</text>`; return;}
  const x0=30,y0=60,stem=L*s,tl=L-stem,sx=x0+stem; let h=`<circle cx="${x0}" cy="${y0}" r="6" fill="#888780"/><line x1="${x0}" y1="${y0}" x2="${sx.toFixed(1)}" y2="${y0}" stroke="#888780" stroke-width="7" stroke-linecap="round"/><circle cx="${sx.toFixed(1)}" cy="${y0}" r="4" fill="#888780"/>`;
  for(let k=0;k<d;k++){const off=d==1?0:sp*(k/(d-1)-0.5), len=tl*((d%2==1&&k==(d-1)/2)?c:1), a=(off-cu*0.6)*Math.PI/180; h+=`<line x1="${sx.toFixed(1)}" y1="${y0}" x2="${(sx+len*Math.cos(a)).toFixed(1)}" y2="${(y0+len*Math.sin(a)).toFixed(1)}" stroke="#7F77DD" stroke-width="4" stroke-linecap="round"/>`;}
  h+=`<text x="${x0-8}" y="${y0+26}" font-size="11" fill="#8a897f">root</text>`; if(stem>10)h+=`<text x="${(x0+stem/2).toFixed(1)}" y="${y0-12}" font-size="11" fill="#8a897f" text-anchor="middle">shaft</text>`; e.innerHTML=h;}
function tinePicker(which){const w=mk('div','tines'); for(let k=0;k<=5;k++){const b=mk('button'); b.title=k?k+' tines':'none'; let g='';
  if(k){g='<svg viewBox="0 0 40 40" width="26" height="26"><line x1="20" y1="36" x2="20" y2="22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>'; for(let j=0;j<k;j++){const off=k==1?0:50*(j/(k-1)-0.5),a=(-90+off)*Math.PI/180; g+=`<line x1="20" y1="22" x2="${(20+15*Math.cos(a)).toFixed(1)}" y2="${(22+15*Math.sin(a)).toFixed(1)}" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>`;} g+='</svg>';} else g='—';
  b.innerHTML=g; if(Math.round(P[which+'Prongs']||0)===k)b.classList.add('on'); b.onclick=()=>{set(which+'Prongs',k); render();}; w.appendChild(b);} return w;}
function segRow(){const w=mk('div','segs'); const n=Math.round(P.segCount); for(let i=0;i<n;i++){const b=mk('button'); b.title='remove a segment'; b.innerHTML='<svg viewBox="0 0 20 40" width="16" height="32"><rect x="7" y="2" width="6" height="36" rx="2" fill="#888780"/><rect x="1" y="6" width="6" height="26" rx="2" fill="#5F5E5A"/><rect x="13" y="6" width="6" height="26" rx="2" fill="#5F5E5A"/></svg>'; b.onclick=()=>{if(n>2){set('segCount',n-1);render();}}; w.appendChild(b);}
  const a=mk('button','add','+'); a.title='add a segment'; a.onclick=()=>{if(n<16){set('segCount',n+1);render();}}; w.appendChild(a); return w;}
// ---- what each cell shows
const VISUAL={
 frame:()=>[sub('segments — tap to remove, + to add'), segRow(), sub('proportions'), svg('bodybar','0 0 340 34'), slider('cephFrac'), slider('pygFrac'), sub('size'), slider('length'), slider('width'), slider('relief')],
 b1:()=>[svg('glab','0 0 340 150'), slider('glabInflate'), slider('glabRise'), slider('glabLobes')],
 a1:()=>[sub('eye'), svg('eye','0 0 340 130'), slider('eyeSize'), slider('eyeArc'), slider('eyeHeight'), sub('genal angle'), slider('genalSpine'), slider('headRearArc'), sub('anterior prong'), svg('prongHead','0 0 340 120'), tinePicker('head'), slider('headProngLen'), slider('headProngStem'), slider('headProngSplay'), slider('headProngCenter'), slider('headProngCurl')],
 b2:()=>[slider('axisFrac'), slider('axisRise'), slider('furrowDepth')],
 a2:()=>[svg('pleura','0 0 340 110'), slider('fulcrum'), slider('pleuralSlope'), slider('overlap')],
 b3:()=>[slider('pygRings'), slider('tailRelief'), slider('tailDomeExp')],
 a3:()=>[slider('pygWidth'), slider('pygSpine'), slider('pygMarginal'), sub('posterior prong'), svg('prongTail','0 0 340 120'), tinePicker('tail'), slider('tailProngLen'), slider('tailProngStem'), slider('tailProngSplay'), slider('tailProngCenter'), slider('tailProngCurl')],
 ruler:()=>[slider('maxAngle'), slider('clearance'), slider('nKnuckles')],
};
const SHOWN=new Set();
function render(){ const c=S.cells[sel]; document.getElementById('cellname').textContent=c.label; document.getElementById('doc').textContent=c.doc;
  [...gridEl.children].forEach(d=>d.classList.toggle('sel',d.dataset.c===sel||(sel==='frame'&&d===frameBtn)||(sel==='ruler'&&d===rulerBtn)));
  C.innerHTML=''; SHOWN.clear(); const els=VISUAL[sel](); els.forEach(e=>C.appendChild(e));
  const used=new Set([...C.querySelectorAll('.row label')].map(l=>l.textContent)); const usedKeys=new Set(S.params.filter(p=>used.has(p.label)).map(p=>p.key));
  if(showMore){ const rest=[...c.primary,...c.more].filter(k=>!usedKeys.has(k)); if(rest.length){C.appendChild(sub('more')); rest.forEach(k=>C.appendChild(slider(k)));} }
  document.getElementById('more').textContent=showMore?'less':'more…'; redrawGlyphs(); }
document.getElementById('more').onclick=()=>{showMore=!showMore;render();};
function scheduleBuild(){ clearTimeout(buildTimer); buildTimer=setTimeout(build, 400); }
// ---- viewer
const view=document.getElementById('view'); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0b0b);
const cam=new THREE.PerspectiveCamera(40,1,1,3000); cam.position.set(180,-260,200); cam.up.set(0,0,1);
const ren=new THREE.WebGLRenderer({antialias:true}); view.appendChild(ren.domElement); const ctl=new OrbitControls(cam,ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x222222,1.2)); const dl=new THREE.DirectionalLight(0xffffff,1.4); dl.position.set(200,-200,400); scene.add(dl);
function resize(){ren.setSize(view.clientWidth,view.clientHeight); cam.aspect=view.clientWidth/view.clientHeight; cam.updateProjectionMatrix();} window.onresize=resize; resize();
const MAT=()=>new THREE.MeshStandardMaterial({color:0xb8b3a4,roughness:0.6,metalness:0.05}); const loader=new GLTFLoader(); const group=new THREE.Group(); scene.add(group);
function highlight(row){ for(const [n,m] of Object.entries(partMeshes)){ const on=row&&(row==='seg'?n.startsWith('seg'):n===row); m.traverse(o=>{if(o.isMesh){o.material.emissive=new THREE.Color(on?0x5a3a00:0x000000);}}); } }
let building=false, pending=false;
async function build(){ if(building){pending=true;return;} building=true; status('building…');
  try{ const man=await (await fetch('/api/build',{method:'POST',body:JSON.stringify({P})})).json();
  kin=man.kinematics; group.clear(); partMeshes={}; limiting=null;
  for(const p of man.parts){ if(p.error) continue; await new Promise(res=>loader.load(p.url,g=>{g.scene.traverse(o=>{if(o.isMesh)o.material=MAT();}); partMeshes[p.name]=g.scene; group.add(g.scene); res();},undefined,()=>res())); }
  pose(0); status(`built in ${man.build_seconds}s · ${man.print.print_valid?'printable':'print: '+man.print.violations.join('; ')}`);
  document.getElementById('print').textContent=man.print.print_valid?'':man.print.violations.join('; '); document.getElementById('theta').textContent='—'; document.getElementById('cls').textContent='not measured';
  } finally { building=false; if(pending){pending=false; build();} } }
function pose(th){ if(!kin) return; const zh=kin.hinge_z, offs=kin.offsets; let M=new THREE.Matrix4(); const rot=new THREE.Matrix4().makeRotationX(-th*Math.PI/180);
  kin.names.forEach((n,i)=>{ if(i>0){ const T=new THREE.Matrix4().makeTranslation(0,offs[i-1],0), U=new THREE.Matrix4().makeTranslation(0,0,zh), D=new THREE.Matrix4().makeTranslation(0,0,-zh); M=M.clone().multiply(T).multiply(U).multiply(rot).multiply(D);} const m=partMeshes[n]; if(m){m.matrixAutoUpdate=false; m.matrix.copy(M);} }); }
function status(t){document.getElementById('status').textContent=t;}
document.getElementById('go').onclick=async()=>{ status('measuring — fixed 45° bevel, probing, sweeping (about 30 s)…'); const r=await (await fetch('/api/measure',{method:'POST',body:JSON.stringify({P})})).json();
  kin=r.kinematics; const th=r.theta_joint_deg; const words={sphaeroidal:'closes; head and tail margins meet',double:'closes; tail tucks under the head',spiral:'closes; tail passes the head front',discoidal:'closes flat, head over tail',open:'stops on itself before closing',censored:'not measurable — '+(r.reason||'ruler ran out')}[r.enroll_class]||r.enroll_class;
  document.getElementById('theta').innerHTML=th==null?'—':`${th}°<span class="dim"> / joint · ${r.total_deg}° total</span>`; document.getElementById('cls').textContent=words+(r.stopped_by&&r.stopped_by.length?` · limited by ${kin.names[r.stopped_by[0][0]]}–${kin.names[r.stopped_by[0][1]]}`:'');
  status(`bevel built ${r.bevel_built_deg}° · ${r.limited_by} · instrument ${r.instrument}`); if(th!=null){ limiting=r.stopped_by&&r.stopped_by[0]; let t=0; const step=()=>{t=Math.min(th,t+th/60); pose(t); if(t<th) requestAnimationFrame(step); else flash();}; step(); } };
function flash(){ if(!limiting) return; let n=0; const [a,b]=limiting; const iv=setInterval(()=>{ n++; for(const i of [a,b]){ const m=partMeshes[kin.names[i]]; if(m) m.traverse(o=>{if(o.isMesh)o.material.emissive=new THREE.Color(n%2?0x8a3a00:0x000000);}); } if(n>7) clearInterval(iv); },220); }
(function loop(){ requestAnimationFrame(loop); ctl.update(); ren.render(scene,cam); })();
render(); build();
</script></body></html>
