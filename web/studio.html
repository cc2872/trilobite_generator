<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trilobite - Studio</title>
<!-- The studio (12 Oct 2026): head and body edited on ONE whole-animal drawing. Pick the head or a row; the panel
     shows its controls. Rows come from isopod_model/rows.diagram (/api/body_diagram); the head from the same Shape /
     head_crescent functions the solid is built from (/api/head_diagram), composed onto the first row exactly as the
     body editor draws it. Build makes the whole animal (head spec + body spec) through /api/build. p5 instance mode.
     Stage 1: the two editors combined. 3D / measure / sheet / share and the home flip come next. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="/static/p5.min.js"></script>
<style>
  :root{--bg:#000;--ink:#fff;--mid:#9a9a9a;--line:#262626;--soft:#141414;--accent:#f6704f;--accent-dim:#7a3326;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,"Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
  body{display:grid;grid-template-columns:292px 1fr;height:100%}
  .panel{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:18px 18px 14px;overflow-y:auto;overflow-x:hidden}
  .panel input[type=text]{min-width:0}
  h1,.sect,.status,.kv,.edits,.val,.btn,.links,.mono,.rowtag{font-family:var(--mono)}
  h1{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:normal;margin:0 0 4px;display:flex;justify-content:space-between}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 10px} .nav button{background:var(--bg);color:var(--mid);border:1px solid var(--line);padding:6px 0;font:inherit;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer} .nav button:hover{color:var(--ink);border-color:var(--ink)}
  .sect{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .sect span:last-child{color:var(--mid);cursor:pointer;letter-spacing:.06em} .sect span:last-child:hover{color:var(--ink)}
  select{width:100%;background:var(--bg);color:var(--ink);border:none;border-bottom:1px solid var(--ink);padding:6px 0;font:inherit;border-radius:0}
  .hint{color:var(--mid);font-size:11px;margin:6px 0 0;line-height:1.45}
  .ctrl{margin:8px 0 0} .ctrl .lab{display:flex;justify-content:space-between;font-size:11px} .ctrl .lab .val{color:var(--mid);font-variant-numeric:tabular-nums} .ctrl .lab .val.on{color:var(--accent)}
  input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--ink);outline:none;margin:7px 0 2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--ink);border:none;cursor:pointer}
  .edits{font-size:11px;line-height:1.7;color:var(--mid);max-height:140px;overflow-y:auto} .edits b{color:var(--ink);font-weight:normal} .edits i{color:var(--mid);font-style:normal;cursor:pointer;margin-left:6px} .edits i:hover{color:var(--accent)}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--ink);padding:7px 0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer} .btn:hover{background:var(--soft)} .btn.primary{background:var(--ink);color:var(--bg)} .btn.primary:hover{background:#ddd} .btn[disabled]{opacity:.4;cursor:default}
  .btn.small{flex:0 0 auto;padding:4px 8px;font-size:9px}
  .status{font-size:10px;letter-spacing:.06em;color:var(--mid);margin-top:10px;min-height:14px;white-space:pre-line} .status.busy{color:var(--accent)}
  .links{font-size:11px;line-height:1.7;margin-top:6px} .links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)} .links a:hover{border-bottom-color:var(--ink)}
  #stage{position:relative;min-width:0;min-height:0} #stage canvas{display:block}
  .kv{position:absolute;right:14px;top:12px;font-size:10px;letter-spacing:.08em;color:var(--mid);text-align:right;line-height:1.6;pointer-events:none} .kv b{color:var(--ink);font-weight:normal}
  .seg{display:flex;gap:0;margin:4px 0 0;border:1px solid var(--line)} .seg button{flex:1;background:var(--bg);color:var(--mid);border:none;border-right:1px solid var(--line);padding:6px 0;font:inherit;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer} .seg button:last-child{border-right:none} .seg button.on{background:var(--ink);color:var(--bg)}
  input.name{flex:1;background:var(--bg);color:var(--ink);border:none;border-bottom:1px solid var(--line);padding:4px 0;font:inherit}
  textarea{width:100%;height:100px;background:var(--bg);color:var(--mid);border:1px solid var(--line);font:11px var(--mono);padding:6px;resize:vertical;display:none}
  body.embed{grid-template-columns:1fr} body.embed .panel{display:none}                 /* embedded in the generator: show only the drawing */
  #embedbuild{display:none;position:absolute;right:16px;bottom:16px;z-index:6;background:var(--ink);color:var(--bg);border:none;padding:10px 20px;font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  body.embed #embedbuild{display:block} #embedbuild:hover{background:#ddd}
  #sheetwrap{display:none;position:absolute;inset:0;background:#000;z-index:5;align-items:center;justify-content:center} #sheetwrap img{max-width:100%;max-height:100%;object-fit:contain}
  #sheetback{position:absolute;left:16px;top:14px;z-index:6;background:var(--bg);color:var(--ink);border:1px solid var(--ink);padding:8px 14px;font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer} #sheetback:hover{background:var(--soft)}
  #sheettoggle{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;display:flex;border:1px solid var(--line)} #sheettoggle button{background:var(--bg);color:var(--mid);border:none;border-right:1px solid var(--line);padding:8px 14px;font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer} #sheettoggle button:last-child{border-right:none} #sheettoggle button.on{background:var(--ink);color:var(--bg)}
  #view3dframe{display:none;width:100%;height:100%;border:0;background:#000}
  @media (max-width:760px){                                   /* mobile: the drawing on top, the controls below, the page scrolls */
    html,body{height:auto;overflow:auto}
    body{grid-template-columns:1fr;min-height:100%}
    #stage{order:0;height:56vh;min-height:300px;border-bottom:1px solid var(--line)}
    .panel{order:1;border-right:none;overflow:visible;max-height:none;padding:14px 14px 24px}
    .edits{max-height:none}
  }
</style>
</head>
<body>
<div class="panel">
  <h1><span>Studio</span><span class="mono" style="color:var(--mid)">head + body</span></h1>
  <div class="nav"><button onclick="location.href='/tree'" title="browse the orders as a ring/spiral family tree">family tree</button><button id="generator" title="the instrument and advanced page: enrollment measurement (the ruler), all parameters, landmarks and share">measure / advanced →</button></div>
  <div class="hint">One animal. Click the <b>head</b> or a <b>row</b> on the drawing; its controls appear below. Drag a handle to shape it.</div>

  <div class="sect"><span>Start from</span><span id="pg"></span></div>
  <select id="preset"></select>
  <div class="ctrl"><div class="lab"><span>head type</span></div><select id="headstyle"></select></div>
  <div class="ctrl"><div class="lab"><span>surface</span></div><select id="model"><option value="thorax">generator segments</option><option value="slab">tergite slab</option></select></div>

  <div class="sect"><span>Prongs</span><span id="prongtoggle">show</span></div>
  <div id="prongctl" style="display:none"></div>

  <div class="sect"><span id="ctxname">Nothing selected</span><span id="ctxtools"></span></div>
  <div id="context"><div class="hint">Click the head or a row on the drawing to edit it.</div></div>

  <div class="sect"><span>Rows</span><span id="reset">reset</span></div>
  <div class="row" style="margin-top:6px"><button class="btn" id="plus" title="add a row after the selected row">+ row</button><button class="btn" id="minus" title="remove the selected row">− row</button></div>
  <div class="row" style="margin-top:6px"><button class="btn" id="addfeature" title="then click anywhere on the animal in plan: a dot is placed there, and you choose what grows from it (a spine or a prong); drag its dots afterwards">+ add feature</button></div>
  <div class="edits" id="rowtable"></div>

  <div class="sect"><span>Save</span><span id="del" style="display:none">delete body</span></div>
  <div class="row" style="margin-top:8px"><input type="text" class="name" id="savebody" placeholder="body name"><button class="btn" id="saveBodyBtn" style="flex:0 0 72px">body</button></div>
  <div class="row" style="margin-top:6px"><input type="text" class="name" id="savehead" placeholder="head name"><button class="btn" id="saveHeadBtn" style="flex:0 0 72px">head</button></div>
  <div class="links" id="openlink"></div>

  <div class="row"><button class="btn" id="copy">copy JSON</button><button class="btn primary" id="build">build</button></div>
  <textarea id="json" readonly></textarea>
  <div class="status" id="status"></div>
  <div class="links" id="links"></div>
</div>
<div id="stage"><div class="kv" id="kv"></div><button id="embedbuild" title="build the blueprint and 3D in the generator">build - blueprint + 3d</button><div id="sheetwrap"><button id="sheetback">← editor</button><span id="sheettoggle"><button id="toblue" class="on">blueprint</button><button id="to3d">view 3d</button></span><img id="sheetimg" alt="blueprint"><iframe id="view3dframe" title="3D view"></iframe></div></div>

<script>
const $=id=>document.getElementById(id);
const S={ preset:'textured', head:'plain', savedBody:null, savedHead:null,
          spec:{list:null, model:'thorax'}, headOutline:{}, headFace:{}, headBaseOutline:{}, headBaseFace:{}, headMeta:null,
          BD:null, HD:null, presets:[], savedBodies:[], savedHeads:[],
          sel:null, pinned:null, hover:null, drag:null, pendingB:false, pendingH:false, edited:false, built:null, P:null, eyeParams:[], prongParams:[], hornParams:[], spineParams:[], tailParams:[] };
const fmt=v=>Number.isInteger(v)?String(v):(+v).toFixed(Math.abs(v)<1?3:(Math.abs(v)<10?2:1));
function status(t,bad){ $('status').textContent=t||''; $('status').classList.toggle('busy',!!bad); }
// a build (STL download + the 3D embed) belongs to one exact animal; any edit after it makes both stale, so drop them (13 Oct 2026)
function invalidateBuild(){ if(!S.built) return; S.built=null; $('links').innerHTML=''; status('edited - rebuild to download / view 3D',false); }
// when embedded in the generator, stream the live head + body so the host's Build/sheet/3D use them (12 Oct 2026)
function postState(){ try{ if(window.parent && window.parent!==window) window.parent.postMessage({type:'trilo-studio', preset:S.preset, head:S.head, headOutline:S.headOutline, headFace:S.headFace, spec:S.spec}, '*'); }catch(_){} }
const EMBED=(()=>{ try{ return !!(window.parent && window.parent!==window); }catch(_){ return true; } })();   // inside the generator's iframe: show only the drawing, hand Build to the host
if(EMBED){ document.body.classList.add('embed'); const b=document.getElementById('embedbuild'); if(b) b.onclick=()=>{ postState(); try{ window.parent.postMessage({type:'trilo-build'}, '*'); }catch(_){} }; }

// ---------- ranges (the page's own; the model files carry units/docs, not ranges) ----------
const R={len:[1,40], width:[1,80], axis:[0.12,0.5], relief:[3,40], margin:[0.05,0.6], sweep:[-20,70], curve:[-30,60], tip:[0,80], tip_w:[0.1,1.5], arch:[0,0.5], fulcrum:[0.1,0.95], slope:[0,1.2], rear_round:[0,1],
         ax_len:[0,120], ax_pitch:[0,90], ax_bend:[-180,180], horn_len:[0,120], horn_rise:[-180,180], horn_roll:[-180,180], horn_yaw:[-80,80]};
const ROWKEYS=['len','width','sweep','curve','tip','tip_w','relief','arch','axis','margin','fulcrum','slope','rear_round'];
const AXKEYS=['ax_len','ax_pitch','ax_bend'];                       // the row's own axial spine (24 Oct 2026): a slider edit or a dot drag makes it its own (ax_own = 1)
const HNKEYS=['horn_len','horn_rise','horn_roll','horn_yaw'];       // ... and its own pleural horn (horn_own = 1)
function hornOf(r,i){ const P=S.P||{}; const thx=S.BD.rows.filter(x=>x.row.kind!=='pyg'); const frac=thx.length>1?Math.min(i/(thx.length-1),1):0;
  if(+r.horn_own>=0.5) return {L:+r.horn_len, turn:+r.horn_rise, roll:+r.horn_roll, yaw:+r.horn_yaw, own:true};
  return {L:(+P.pleuralHorn||0)*(+r.width)*(1+(+P.pleuralHornGrad||0)*frac), turn:(+P.pleuralHornPitch||45)+(+P.pleuralHornBend||0), roll:(+P.pleuralHornRoll||0), yaw:0, own:false}; }
const FSKEYS=['x','y','len','rise','roll','yaw','tines','splay','stem','curl']; const FSR={x:[0,120], y:[-80,400], len:[0,200], rise:[-180,180], roll:[-180,180], yaw:[-180,180], tines:[1,5], splay:[0,180], stem:[0,0.9], curl:[-60,60]};
let addMode=false; $('addfeature').onclick=()=>{ addMode=!addMode; $('addfeature').classList.toggle('on',addMode); if(!addMode){ S.pending=null; renderContext(); } status(addMode?'click on the animal to place a dot there':'' ,false); };
// the placed dot, before it is anything (25 Oct 2026): S.pending = {x, y}; the panel asks what grows from it
function growFeature(kind){ const d=S.pending; if(!d) return; S.spec.spines=S.spec.spines||[]; const rel=(S.P&&+S.P.relief)||17; const prong=kind==='prong';
  S.spec.spines.push(Object.assign({x:d.x, y:d.y, len:+((prong?1.5:1.2)*rel).toFixed(1), rise:45, roll:0, yaw:(d.x<0.75?0:35)}, prong?{tines:2, splay:40, stem:0.4, curl:0}:{}));
  S.pending=null; S.sel={type:'free',j:S.spec.spines.length-1}; status(prong?'prong added - drag its dots (root, fork, tips) or use the sliders':'spine added - drag its dots (root, mid, tip) or use the sliders',false); sendBody(); renderContext(); renderTable(); }
function freeList(){ const D=S.BD; const L=S.spec.spines||[]; const info=(D&&D.free)||[]; return L.map((q,j)=>{ const f=info[j]; const rt=(f&&f.root&&!(S.drag&&S.drag.kind==='fs'&&S.drag.j===j))?f.root:[q.x,q.y];   // the root as the build places it (snapped onto the plate); while its dot is dragged, the mouse
  return Object.assign({}, q, {x:rt[0], y:rt[1], z:(f&&f.z!=null)?f.z:((S.P&&+S.P.relief)||17)*0.6, part:f?f.part:null, moved:f?f.moved:0, cover:f?f.cover:1, thin:(f&&f.thin!=null)?f.thin:1}); }); }
function freeAngles(rise){ rise=+rise||0; const p=rise>=0?Math.max(0.35*rise,Math.min(rise,30)):0.35*rise; return [p, rise-p]; }   // = rows.free_spine_angles: leave at >= 30 degrees, bend the rest
function snapFreeRoots(){ const info=(S.BD&&S.BD.free)||[]; let n=0; (S.spec.spines||[]).forEach((q,j)=>{ const f=info[j]; if(f&&f.root&&f.moved>0.05){ q.x=+f.root[0].toFixed(2); q.y=+f.root[1].toFixed(2); n++; } }); return n; }   // the spec takes the snapped roots (so the dots sit where the spines will be)
const TSKEYS=['phi','len','rise','roll','blade']; const TSR={phi:[0,90], len:[0,200], rise:[-180,180], roll:[-180,180], blade:[0,1]};
function ownTail(){ if(S.spec.tail_spines) return; const T=S.BD&&S.BD.tail; S.spec.tail_spines=(T?T.spines:[]).map(q=>({phi:q.phi, len:q.len, rise:q.rise, roll:q.roll, blade:q.blade})); }   // freeze the preset's spines into the body's own list
function ownHorn(i){ const r=S.spec.list[i]; if(+r.horn_own>=0.5) return; const h=hornOf(r,i); r.horn_own=1; r.horn_len=+h.L.toFixed(3); r.horn_rise=+h.turn.toFixed(1); r.horn_roll=+h.roll.toFixed(1); r.horn_yaw=+h.yaw.toFixed(1); }
// what a row's axial spine is: its own numbers, or the preset's (P) with the gradient along the thorax
function axialOf(r,i){ const P=S.P||{}; const rel=+P.relief||17; const thx=S.BD.rows.filter(x=>x.row.kind!=='pyg'); const frac=thx.length>1?Math.min(i/(thx.length-1),1):0;
  if(+r.ax_own>=0.5) return {L:+r.ax_len, pitch:+r.ax_pitch, bend:+r.ax_bend, own:true};
  return {L:(+P.axialSpine||0)*rel*(1+(+P.axialGrad||0)*frac), pitch:(+P.axialPitch||60), bend:(+P.axialBend||0), own:false}; }
const ALIAS={glabInflate:'glab_inflate', eyePos:'eye_pos', eyeLat:'eye_lat', eyeSize:'eye_size', glabRise:'glab_rise'};
const RH={
  width:[0.6,2.0], length:[0.5,2.0], front_exp:[1.0,6.0], front_point:[0,0.6], widest:[0,0.6], side:[0,0.6], rear_taper:[0,0.6], corner:[0,0.5],
  genal:[0,2.5], genal_w:[0.03,0.6], genal_tip:[0.05,1.0], genal_spread:[-30,60], genal_curve:[-60,60], notch:[0,1], notch_exp:[1,6], dome_fill:[0.4,1],
  horn_h:[0,0.6], height:[0.4,2.0], genal_at:[-1,1], front_flat:[0,0.9], front_dent:[0,0.3], point_w:[0.02,0.5], point_fork:[0,0.8],
  brim_w:[0,0.6], brim_rise:[0,0.4], brim_curve:[-1,1], brim_roll:[0,0.3], brim_pits:[0,6,1],
  eye_size:[0,0.5], eye_pos:[0.2,0.95], eye_height:[0.2,2.5], eye_lat:[0,0.95], axis_frac:[0.15,0.45], glab_inflate:[0.5,2.0], glab_rise:[0,0.6],
  glab_front:[1,6], glab_lobes:[0,6,1], furrow:[0,2.5], border_w:[0,0.3], suture_end:[-1,1], suture_depth:[0,0.6], eye_ridge:[0,1.5],
  glab_len:[0.3,1.2], glab_bulge:[-0.3,0.3], glab_round:[0,1], glab_boss:[0,0.45], boss_rise:[0,1], furrow_cross:[0,1], furrow_splay:[0,1],
  bullae:[0,0.3], node:[0,1.5], eye_len:[0.5,3], caeca:[0,1], brim:[0,0.5], brim_drop:[0,1.5], tubercles:[0,1], tub_all:[0,1,1], efface:[0,1]};

// ---------- head key helpers ----------
const isFace=k=>S.headMeta && (k in S.headMeta.face_defaults);
const isOut=k=>S.headMeta && (k in S.headMeta.outline_defaults);
const headBaseOf=k=>isOut(k)?S.headBaseOutline[k]:S.headBaseFace[k];
const headCur=k=>S.HD?(isOut(k)?S.HD.outline[k]:S.HD.face[k]):undefined;
function clampR(k,v,T){ const r=(T||R)[k]||[-1e9,1e9]; v=Math.min(r[1],Math.max(r[0],v)); if(r[2]) v=Math.round(v); return v; }
function clampH(k,v){ const r=RH[k]||[-1e9,1e9]; v=Math.min(r[1],Math.max(r[0],v)); if(r[2]) v=Math.round(v); return v; }
function setHeadKey(k,v,quiet){ v=clampH(k,v); const edits=isOut(k)?S.headOutline:S.headFace; if(Math.abs(v-headBaseOf(k))<1e-9) delete edits[k]; else edits[k]=+v.toFixed(4); if(!quiet) sendHead(); }
function setEyeParam(k,v){ if(!S.P) return; S.P[k]=+v; S.edited=true; invalidateBuild(); status('edited - Build to see it',false); if(/^(pyg|term|tail|relief|axialSpine)/.test(k)) sendBody(); }   // tail / side-view params: the server draws those   // a schema param on P (eye / prong); the 2D drawing can't show it, so feedback is on Build / 3D
function renderProngs(){ const box=$('prongctl'); if(!box) return; if(!S.P||!S.prongParams.length){ box.innerHTML=''; return; } box.innerHTML='';
  for(const p of S.prongParams){ const v=(S.P[p.key]!=null?S.P[p.key]:p.default);
    if(p.key==='headProngs'||p.key==='tailProngs') prongStepper(box,p);
    else slider(box,p.key,v,p.lo,p.hi,p.step||((p.hi-p.lo)/200),val=>setEyeParam(p.key,val),p.unit||''); } }
function prongStepper(box,p){ const cur=()=>Math.round(S.P[p.key]!=null?S.P[p.key]:p.default); const d=document.createElement('div'); d.className='ctrl';
  d.innerHTML=`<div class="lab"><span>${p.label.toLowerCase()} (tines)</span><span class="val" id="v_${p.key}">${cur()}</span></div><div class="row" style="margin-top:4px"><button class="btn small" data-s="-1">- tine</button><button class="btn small" data-s="1">+ tine</button></div>`;
  box.appendChild(d); d.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const nv=Math.max(p.lo,Math.min(p.hi,cur()+(+b.dataset.s))); S.P[p.key]=nv; $('v_'+p.key).textContent=nv; S.edited=true; invalidateBuild(); status('edited - Build to see it',false); }); }
let showProngs=false;
$('prongtoggle').onclick=()=>{ showProngs=!showProngs; $('prongtoggle').textContent=showProngs?'hide':'show'; $('prongctl').style.display=showProngs?'':'none'; if(showProngs) renderProngs(); };

// ---------- row helpers ----------
const rowOf=i=>S.spec.list[i];
function setRow(i,k,v,quiet){ v=clampR(k,v); S.spec.list[i][k]=+v.toFixed(3); if(!quiet) sendBody(); }
function ownAxial(i){ const r=S.spec.list[i]; if(+r.ax_own>=0.5) return; const ax=axialOf(r,i); r.ax_own=1; r.ax_len=+ax.L.toFixed(3); r.ax_pitch=+ax.pitch.toFixed(1); r.ax_bend=+ax.bend.toFixed(1); }   // freeze the preset's spine into the row before editing it
function setBodyModel(v){ S.spec.model=v; sendBody(); }
function insertRow(at,src){ const r=Object.assign({},S.spec.list[src]); S.spec.list.splice(at,0,r); S.sel={type:'row',i:at}; S.pinned=at; sendBody(); renderContext(); renderTable(); }
function removeRow(i){ if(S.spec.list.length<=2){ status('keep at least two rows',true); return; } S.spec.list.splice(i,1); S.pinned=Math.min(i,S.spec.list.length-1); S.sel={type:'row',i:S.pinned}; sendBody(); renderContext(); renderTable(); }

// ---------- server ----------
async function loadAll(preset, bodyName, start){
  S.edited=false; S.built=null; $('links').innerHTML='';
  const hu='/api/head_diagram?style='+encodeURIComponent(S.head);
  const bu=`/api/body_diagram?preset=${encodeURIComponent(preset)}&head=${encodeURIComponent(S.head)}`+(bodyName?`&body=${encodeURIComponent(bodyName)}`:(start==='plain'?'&start=boring':''));
  const [hd,bd]=await Promise.all([ (await fetch(hu)).json(), (await fetch(bu)).json() ]);
  if(hd.error){ status(hd.error,true); return; } if(bd.error){ status(bd.error,true); return; }
  // head
  S.headMeta=hd; S.HD=hd; S.headBaseOutline=hd.outline; S.headBaseFace=hd.face; S.headOutline={}; S.headFace={};
  S.savedHead=hd.saved?hd.saved.name:null; if(hd.saved){ S.head=hd.base; S.headOutline=Object.assign({},hd.saved.outline); S.headFace=Object.assign({},hd.saved.face); }
  // body
  S.preset=preset; S.savedBody=bodyName||null; S.start=bodyName?'saved':(start||'preset');
  S.spec=Object.assign({}, bd.spec||{}); delete S.spec.rows; for(const k of ['thorax_rows','pyg_rows','thorax_len','pyg_len']) delete S.spec[k];   // tail_spines (if saved) stays
  S.spec.list=bd.diagram.list.map(r=>Object.assign({},r)); S.spec.model=S.spec.model||bd.diagram.model||'thorax'; $('model').value=S.spec.model;
  S.BD=bd.diagram; S.presets=bd.presets; S.savedBodies=bd.saved_bodies; S.pinned=null; S.sel=null;
  try{ S.P=await (await fetch('/api/preset/'+encodeURIComponent(preset))).json(); }catch(_){ S.P=S.P||{}; }   // the schema params (incl. the eye): editable here, built as-is by the generator pipeline
  $('savebody').value=S.savedBody||''; $('savehead').value=S.savedHead||'';
  $('del').style.display=S.savedBody?'':'none';
  fillPickers(); renderContext(); renderTable(); kv(); postState(); if(showProngs) renderProngs();
}
let inflightB=null, inflightH=null;
async function sendBody(){ S.edited=true; invalidateBuild(); postState(); renderTable();
  if(inflightB){ S.pendingB=true; return; }
  inflightB=fetch('/api/body_diagram',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({preset:S.preset, spec:S.spec, head:S.head, P:S.P||undefined})})
    .then(r=>r.json()).then(d=>{ if(d.error){ status(d.error,true); return; } S.BD=d.diagram; if(!(S.drag&&S.drag.kind==='fs')){ const n=snapFreeRoots(); if(n){ postState(); const f=(S.BD.free||[]).filter(f=>f.moved>0.05); status(`${n} spine root${n>1?'s':''} moved onto the plate (${f.map(f=>f.moved.toFixed(1)+' mm').join(', ')}): the collar would have hung over a joint or a notch`,false); } } kv(); renderContext(false); renderTable(); })
    .catch(e=>status(String(e),true)).finally(()=>{ inflightB=null; if(S.pendingB){ S.pendingB=false; sendBody(); } }); }
async function sendHead(){ S.edited=true; invalidateBuild(); postState(); renderContext(false);
  if(inflightH){ S.pendingH=true; return; }
  inflightH=fetch('/api/head_diagram',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({style:S.head, outline:S.headOutline, face:S.headFace})})
    .then(r=>r.json()).then(d=>{ if(d.error){ status(d.error,true); return; } S.HD=d; kv(); renderContext(false); })
    .catch(e=>status(String(e),true)).finally(()=>{ inflightH=null; if(S.pendingH){ S.pendingH=false; sendHead(); } }); }
function kv(){ const D=S.BD; if(!D) return; $('kv').innerHTML=`<b>${S.savedBody?S.savedBody:(S.start==='plain'?'plain trilobite':S.preset)}</b> - head <b>${S.savedHead||S.head}</b><br>rows <b>${D.rows.length}</b> - pieces <b>${D.pieces.length}</b><br>print <b>${D.print_size_mm.length} × ${D.print_size_mm.width} mm</b> - scale <b>${D.scale.toFixed(2)}</b>`+((D.problems||[]).length?`<br><span style="color:var(--accent)">cannot build: ${D.problems.join(' - ')}</span>`:'')+(((S.HD&&S.HD.diagram.notes)||[]).length?`<br><span style="color:var(--accent)">head: ${S.HD.diagram.notes.join(' - ')}</span>`:''); $('build').disabled=!!(D.problems||[]).length; }

// ---------- panel ----------
function fillPickers(){ const ps=$('preset'); ps.innerHTML=`<option value="plain">plain trilobite</option><optgroup label="presets">${S.presets.map(n=>`<option value="${n}">${n}</option>`).join('')}</optgroup>`+(S.savedBodies.length?`<optgroup label="saved bodies">${S.savedBodies.map(b=>`<option value="saved:${b.name}">${b.name} - ${b.preset}</option>`).join('')}</optgroup>`:''); ps.value=S.savedBody?'saved:'+S.savedBody:(S.start==='plain'?'plain':S.preset);
  const hsOpts=['plain','crescent',...(S.headMeta.styles||[]).map(x=>x.name).filter(n=>n!=='plain')]; const hs=$('headstyle');
  hs.innerHTML=`<optgroup label="guide">${hsOpts.map(n=>`<option value="${n}">${n}</option>`).join('')}</optgroup>`+((S.headMeta.saved_heads||[]).length?`<optgroup label="saved">${S.headMeta.saved_heads.map(h=>`<option value="${h.name}">${h.name} - ${h.style}</option>`).join('')}</optgroup>`:'');
  hs.value=S.savedHead||S.head;
}
$('preset').onchange=e=>{ const v=e.target.value; if(v==='plain') loadAll('textured',null,'plain'); else if(v.startsWith('saved:')){ const b=S.savedBodies.find(x=>x.name===v.slice(6)); loadAll(b.preset,b.name); } else loadAll(v); };
$('headstyle').onchange=e=>{ S.head=e.target.value; loadAll(S.preset, S.savedBody, S.start==='plain'?'plain':null); };
$('model').onchange=e=>{ setBodyModel(e.target.value); };
$('reset').onclick=()=>loadAll('textured',null,'plain');
$('plus').onclick=()=>{ const at=(S.sel&&S.sel.type==='row')?S.sel.i+1:S.spec.list.length; insertRow(at, at-1); status(`row ${at} added`); };
$('minus').onclick=()=>{ const i=(S.sel&&S.sel.type==='row')?S.sel.i:S.spec.list.length-1; removeRow(i); status(`row ${i} removed`); };

function slider(box,k,val,lo,hi,step,onin,tag,faint){ const d=document.createElement('div'); d.className='ctrl';
  d.innerHTML=`<div class="lab"><span>${({front_exp:'front_exp - pointiness (1.2 sharp, 2 round, 4 blunt)',genal_tip:'genal_tip - tip / root width',notch:'notch - rear margin U depth'})[k]||k}${tag?' <span style="color:var(--mid)">- '+tag+'</span>':''}</span><span class="val" id="v_${k}"></span></div><input type="range" min="${lo}" max="${hi}" step="${step}" id="s_${k}">`;
  if(faint) d.style.opacity=0.4; box.appendChild(d); const inp=d.querySelector('input'); inp.value=val; d.querySelector('.val').textContent=fmt(val);
  inp.oninput=()=>{ onin(+inp.value); d.querySelector('.val').textContent=fmt(+inp.value); d.querySelector('.val').classList.add('on'); }; return d; }

function renderContext(rebuild=true){ const box=$('context');
  if(S.pending){ $('ctxname').textContent=`New feature at (${S.pending.x.toFixed(1)}, ${S.pending.y.toFixed(1)})${S.pending.x<0.75?' - on the axis':' - mirrored'}`; $('ctxtools').innerHTML='';
    box.innerHTML='<div class="hint">What grows from the dot?</div>'; box.dataset.k='pending'; const row=document.createElement('div'); row.className='row'; row.style.marginTop='8px';
    for(const [t,f,tip] of [['spine',()=>growFeature('spine'),'one curved spine'],['prong',()=>growFeature('prong'),'a forked spine: tines, fan, stem'],['cancel',()=>{ S.pending=null; renderContext(); },'']]){ const b=document.createElement('button'); b.className='btn small'; b.textContent=t; b.title=tip; b.onclick=f; row.appendChild(b); }
    box.appendChild(row); return; }
  if(!S.sel){ if(rebuild){ box.innerHTML='<div class="hint">Click the head or a row on the drawing to edit it.</div>'; $('ctxname').textContent='Nothing selected'; $('ctxtools').innerHTML=''; } return; }
  if(S.sel.type==='head'){ $('ctxname').textContent='Head - '+(S.savedHead||S.head); $('ctxtools').innerHTML='';
    const keys=[...Object.keys(S.headMeta.outline_defaults),...Object.keys(S.headMeta.face_defaults)];
    if(rebuild||box.dataset.k!=='head'){ box.innerHTML=''; box.dataset.k='head';
      for(const k of keys){ const r=RH[k]||[0,1]; slider(box,k,headCur(k),r[0],r[1],r[2]||((r[1]-r[0])/200),val=>setHeadKey(k,val),isOut(k)?'':'face'); }
      if(S.P && S.eyeParams.length){ const hdr=document.createElement('div'); hdr.className='sect'; hdr.innerHTML='<span>Eye</span><span class="mono" style="color:var(--mid);text-transform:none;letter-spacing:0">shows on build / 3D</span>'; box.appendChild(hdr);
        for(const p of S.eyeParams){ const v=(S.P[p.key]!=null?S.P[p.key]:p.default); slider(box,p.key,v,p.lo,p.hi,p.step||((p.hi-p.lo)/200),val=>setEyeParam(p.key,val),p.unit||''); } }
      if(S.P && S.hornParams.length){ const hdr=document.createElement('div'); hdr.className='sect'; hdr.innerHTML='<span>Genal horn</span><span class="mono" style="color:var(--mid);text-transform:none;letter-spacing:0">a solid spine of its own - curves, hooks, turns in</span>'; box.appendChild(hdr);
        for(const p of S.hornParams){ const v=(S.P[p.key]!=null?S.P[p.key]:p.default); slider(box,p.key,v,p.lo,p.hi,p.step||((p.hi-p.lo)/200),val=>setEyeParam(p.key,val),p.unit||''); } } }
    else { for(const k of keys){ const s=$('s_'+k); if(s&&document.activeElement!==s){ const v=headCur(k); s.value=v; $('v_'+k).textContent=fmt(v); $('v_'+k).classList.toggle('on',Math.abs(v-headBaseOf(k))>1e-9); } }
      if(S.P) for(const p of [...S.eyeParams,...S.hornParams]){ const s=$('s_'+p.key); if(s&&document.activeElement!==s){ s.value=S.P[p.key]; $('v_'+p.key).textContent=fmt(S.P[p.key]); } } }
    return; }
  if(S.sel.type==='free'){ const j=S.sel.j; const L=S.spec.spines||[]; if(j>=L.length){ S.sel=null; return renderContext(); } const q=L[j];
    $('ctxname').textContent=`${(q.tines||1)>1?'Prong':'Spine'} ${j}${q.x<0.75?' - on the axis':' - mirrored'}`; $('ctxtools').innerHTML='';
    if(rebuild||box.dataset.k!=='fs'+j){ box.innerHTML=''; box.dataset.k='fs'+j;
      for(const k of FSKEYS){ const rr=FSR[k]; slider(box,k,q[k],rr[0],rr[1],(rr[1]-rr[0])/300,val=>{ q[k]=+(+val).toFixed(3); sendBody(); },{x:'mm across',y:'mm along (- = head)',len:'mm',rise:'deg',roll:'deg',yaw:'deg, + outward',tines:'1 = a plain spine; 2 = a fork; 3 = a trident',splay:'deg, the fan of the tines',stem:'the shared stem, as a share of the length',curl:'deg, the tines lift (or dip) at the split'}[k]); }
      const row=document.createElement('div'); row.className='row'; row.style.marginTop='8px';
      for(const [t,f] of [['duplicate',()=>{ L.splice(j+1,0,Object.assign({},q,{y:q.y+8})); S.sel={type:'free',j:j+1}; sendBody(); renderContext(); }],
                          ['- spine',()=>{ L.splice(j,1); S.sel=L.length?{type:'free',j:Math.min(j,L.length-1)}:null; sendBody(); renderContext(); }]]){ const b=document.createElement('button'); b.className='btn small'; b.textContent=t; b.onclick=f; row.appendChild(b); }
      box.appendChild(row); }
    else for(const k of FSKEYS){ const s=$('s_'+k); if(s&&document.activeElement!==s){ s.value=q[k]; $('v_'+k).textContent=fmt(q[k]); } }
    return; }
  if(S.sel.type==='tailspine'){ const j=S.sel.j; const L=S.spec.tail_spines||[]; if(j>=L.length){ S.sel=null; return renderContext(); } const q=L[j];
    $('ctxname').textContent=`Tail spine ${j}`; $('ctxtools').innerHTML='';
    if(rebuild||box.dataset.k!=='ts'+j){ box.innerHTML=''; box.dataset.k='ts'+j;
      for(const k of TSKEYS){ const rr=TSR[k]; slider(box,k,q[k],rr[0],rr[1],(rr[1]-rr[0])/300,val=>{ q[k]=+(+val).toFixed(3); sendBody(); },{phi:'deg along the margin',len:'mm',rise:'deg',roll:'deg',blade:'flat share'}[k]); }
      const row=document.createElement('div'); row.className='row'; row.style.marginTop='8px';
      for(const [t,f] of [['+ spine',()=>{ L.splice(j+1,0,Object.assign({},q,{phi:Math.max(0,q.phi-8)})); S.sel={type:'tailspine',j:j+1}; sendBody(); renderContext(); }],
                          ['- spine',()=>{ L.splice(j,1); S.sel=L.length?{type:'tailspine',j:Math.min(j,L.length-1)}:null; sendBody(); renderContext(); }],
                          ["preset's spines",()=>{ delete S.spec.tail_spines; S.sel=null; sendBody(); renderContext(); }]]){ const b=document.createElement('button'); b.className='btn small'; b.textContent=t; b.onclick=f; row.appendChild(b); }
      box.appendChild(row); }
    else for(const k of TSKEYS){ const s=$('s_'+k); if(s&&document.activeElement!==s){ s.value=q[k]; $('v_'+k).textContent=fmt(q[k]); } }
    return; }
  // a row
  const i=S.sel.i; if(i>=S.spec.list.length){ S.sel=null; return renderContext(); }
  const r=rowOf(i); const dr=S.BD&&S.BD.rows[i]; $('ctxname').textContent=`Row ${i} - ${r.kind}${dr&&dr.small?' - fused':''}`;
  if(rebuild||box.dataset.k!=='row'+i){ box.innerHTML=''; box.dataset.k='row'+i;
    for(const k of ROWKEYS){ const rr=R[k]; slider(box,k,r[k],rr[0],rr[1],(rr[1]-rr[0])/300,val=>setRow(i,k,val),S.BD.keys[k].unit, S.BD.model!=='slab'&&/slab model only/.test(S.BD.keys[k].doc)); }
    { const hdr=document.createElement('div'); hdr.className='sect'; hdr.innerHTML=`<span>Axial spine - this row</span><span class="mono" style="color:var(--mid);text-transform:none;letter-spacing:0">${+r.ax_own>=0.5?'its own':'the preset\'s - drag its dots or move a slider'}</span>`; box.appendChild(hdr);
      const ax=axialOf(r,i); for(const k of AXKEYS){ const rr=R[k]; const v={ax_len:ax.L,ax_pitch:ax.pitch,ax_bend:ax.bend}[k]; slider(box,k,v,rr[0],rr[1],(rr[1]-rr[0])/300,val=>{ ownAxial(i); setRow(i,k,val); },S.BD.keys[k]?S.BD.keys[k].unit:''); }
      if(+r.ax_own>=0.5){ const b=document.createElement('button'); b.className='btn small'; b.textContent="back to the preset's spine"; b.onclick=()=>{ S.spec.list[i].ax_own=0; sendBody(); renderContext(); }; box.appendChild(b); } }
    if(r.kind!=='pyg'){ const hdr=document.createElement('div'); hdr.className='sect'; hdr.innerHTML=`<span>Pleural horn - this row</span><span class="mono" style="color:var(--mid);text-transform:none;letter-spacing:0">${+r.horn_own>=0.5?'its own':'the preset\'s - drag its dots in plan or move a slider'}</span>`; box.appendChild(hdr);
      const hn=hornOf(r,i); for(const k of HNKEYS){ const rr=R[k]; const v={horn_len:hn.L,horn_rise:hn.turn,horn_roll:hn.roll,horn_yaw:hn.yaw}[k]; slider(box,k,v,rr[0],rr[1],(rr[1]-rr[0])/300,val=>{ ownHorn(i); setRow(i,k,val); },S.BD.keys[k]?S.BD.keys[k].unit:''); }
      if(+r.horn_own>=0.5){ const b=document.createElement('button'); b.className='btn small'; b.textContent="back to the preset's horn"; b.onclick=()=>{ S.spec.list[i].horn_own=0; sendBody(); renderContext(); }; box.appendChild(b); } }
    const pgroup=(title,note,ps)=>{ if(!S.P||!ps.length) return; const hdr=document.createElement('div'); hdr.className='sect'; hdr.innerHTML=`<span>${title}</span><span class="mono" style="color:var(--mid);text-transform:none;letter-spacing:0">${note}</span>`; box.appendChild(hdr);
      for(const p of ps){ const v=(S.P[p.key]!=null?S.P[p.key]:p.default); slider(box,p.key,v,p.lo,p.hi,p.step||((p.hi-p.lo)/200),val=>setEyeParam(p.key,val),p.unit||''); } };
    if(r.kind==='pyg') pgroup('Tail','whole tail - drawn in plan, built on Build',S.tailParams);                      // 24 Oct 2026: the tail's ribs, furrows and spines
    pgroup('Spines','every row - drawn live, built on Build',S.spineParams);                                           // 24 Oct 2026: axial spines and pleural horns
    $('ctxtools').innerHTML=`<select id="kind" style="width:auto;padding:2px 0;font-size:10px"><option value="thorax">thorax</option><option value="pyg">pyg</option></select>`;
    $('kind').value=r.kind; $('kind').onchange=e=>{ S.spec.list[i].kind=e.target.value; sendBody(); }; }
  else { for(const k of ROWKEYS){ const s=$('s_'+k); if(s&&document.activeElement!==s){ s.value=r[k]; $('v_'+k).textContent=fmt(r[k]); } }
    { const ax=axialOf(r,i); for(const [k,v] of [['ax_len',ax.L],['ax_pitch',ax.pitch],['ax_bend',ax.bend]]){ const s=$('s_'+k); if(s&&document.activeElement!==s){ s.value=v; $('v_'+k).textContent=fmt(v); } }
      const hn=hornOf(r,i); for(const [k,v] of [['horn_len',hn.L],['horn_rise',hn.turn],['horn_roll',hn.roll],['horn_yaw',hn.yaw]]){ const s=$('s_'+k); if(s&&document.activeElement!==s){ s.value=v; $('v_'+k).textContent=fmt(v); } } }
    if(S.P) for(const p of [...S.spineParams,...S.tailParams]){ const s=$('s_'+p.key); if(s&&document.activeElement!==s){ s.value=S.P[p.key]; $('v_'+p.key).textContent=fmt(S.P[p.key]); } } }
}
function renderTable(){ const e=$('rowtable'); const L=S.spec.list; const D=S.BD; if(!L) return;
  e.innerHTML=L.map((r,i)=>{ const dr=D&&D.rows[i]; const on=S.sel&&S.sel.type==='row'&&i===S.sel.i; return `<div data-i="${i}" style="cursor:pointer;${on?'color:var(--accent)':''}"><b${on?' style="color:var(--accent)"':''}>${String(i).padStart(2,' ')}</b> ${r.kind==='pyg'?'pyg ':'thx '}len ${fmt(r.len)} - w ${fmt(r.width)}${dr&&dr.small?' <span style="color:var(--accent)">fused</span>':''}</div>`; }).join('');
  e.querySelectorAll('div[data-i]').forEach(x=>x.onclick=()=>{ S.sel={type:'row',i:+x.dataset.i}; S.pinned=+x.dataset.i; renderContext(); renderTable(); }); }

  status(`saved body ${name}`); S.savedBody=name; const d=await (await fetch('/api/body_diagram?preset='+encodeURIComponent(S.preset))).json(); S.savedBodies=d.saved_bodies; fillPickers(); };
$('saveHeadBtn').onclick=async()=>{ const name=$('savehead').value.trim(); if(!name){ status('name the head',true); return; }
  const r=await fetch('/api/heads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name, style:S.head, outline:S.headOutline, face:S.headFace})}); const j=await r.json(); if(!r.ok){ status(j.error||'save failed',true); return; }
  status(`saved head ${name}`); S.savedHead=name; const d=await (await fetch('/api/head_diagram?style='+encodeURIComponent(name))).json(); S.headMeta=Object.assign({},S.headMeta,{saved_heads:d.saved_heads||S.headMeta.saved_heads}); fillPickers(); };
$('del').onclick=async()=>{ if(!S.savedBody) return; const n=S.savedBody; const r=await fetch('/api/bodies/'+encodeURIComponent(n),{method:'DELETE'}); if(!r.ok){ status('delete failed',true); return; } status(`deleted ${n}`); loadAll(S.preset,null,'plain'); };
$('copy').onclick=()=>{ const txt=JSON.stringify({preset:S.preset, head:{style:S.head, outline:S.headOutline, face:S.headFace}, body:S.spec}); const ta=$('json'); ta.value=txt; ta.style.display='block'; ta.select(); try{ navigator.clipboard.writeText(txt); status('copied'); }catch(_){ status('select and copy'); } };
const headArg=()=>(Object.keys(S.headOutline).length||Object.keys(S.headFace).length||S.savedHead||S.head!=='crescent')?{style:S.head, outline:S.headOutline, face:S.headFace}:null;
$('build').onclick=async()=>{ const b=$('build'); b.disabled=true; const t0=Date.now(); const tick=setInterval(()=>status(`building - ${Math.round((Date.now()-t0)/1000)} s`,true),500);
  try{ const P=S.P||await (await fetch('/api/preset/'+encodeURIComponent(S.preset))).json();
    const r=await fetch('/api/build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({P, joint:'isopod', head:headArg(), body:S.spec})}); const m=await r.json(); clearInterval(tick);
    if(!r.ok||!m.parts||!m.parts.length){ status('build failed - '+((m.build_notes||[]).map(n=>n[2]).join('; ')||m.error||r.status),true); }
    else{ const bad=m.parts.filter(p=>!p.watertight||p.bodies!==1).length; status(`built ${m.parts.length} pieces in ${m.build_seconds} s${bad?` - ${bad} not watertight`:''}`,!!bad);
      S.built=m.key;                                                                     // this STL + the 3D embed now belong to this exact animal; an edit drops them (invalidateBuild)
      $('links').innerHTML=`<a href="/api/stl/${m.key}">download STL (all pieces, print mm)</a>`;

function headKeysFor(h){ const ks=((S.headMeta&&S.headMeta.handles[h])||[]).map(k=>ALIAS[k]||k); return ks.filter(k=>isOut(k)||isFace(k)); }

// ---------- start ----------
(async()=>{ const u=new URLSearchParams(location.search); S.head=u.get('head')||'plain';
  try{ const sc=await (await fetch('/api/schema')).json(); const EK=new Set(['eyeSize','eyeArc','eyePos','eyeLat','eyeHeight','eyeProfile','eyeStalk','eyeStalkR','eyeStalkBend','eyeLean','eyeSphere','lensD','lensGap']);
       S.eyeParams=(sc.params||[]).filter(p=>EK.has(p.key)); S.prongParams=(sc.params||[]).filter(p=>p.group==='Prongs'); S.hornParams=(sc.params||[]).filter(p=>p.key.startsWith('genalHorn'));
       const SK=['axialSpine','axialPitch','axialBend','axialGrad','pleuralHorn','pleuralHornPitch','pleuralHornBend','pleuralHornRoll','pleuralHornGrad','spineBase','spineGrad','spineSweep','tipTaper'];
       const TK=['pygRings','pygRibRelief','pygFurrowScale','pygSpine','pygSplay','pygMarginal','pygMarginalLen','pygSpineRise','pygSpineBend','pygSpineGrow','pygSpineBlade','termSpine','termBend','tailOutlineExp','pygBorderWidth'];
       const by=k=>(sc.params||[]).find(p=>p.key===k); S.spineParams=SK.map(by).filter(Boolean); S.tailParams=TK.map(by).filter(Boolean); }catch(_){ S.eyeParams=[]; S.prongParams=[]; S.hornParams=[]; S.spineParams=[]; S.tailParams=[]; }   // the eye and prong params -> their panel sliders
  const body=u.get('body'); if(body){ const b=(await (await fetch('/api/bodies')).json()).find(x=>x.name===body); if(b){ if(b.head) S.head=b.head; await loadAll(b.preset, body); return; } }
  if(u.get('preset')) await loadAll(u.get('preset')); else await loadAll('textured', null, 'plain'); })();
